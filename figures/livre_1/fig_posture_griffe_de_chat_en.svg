<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="100%">
  <rect width="800" height="370" rx="14" fill="#fcfbf7" stroke="#dfdacf" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="34" font-family="Liberation Serif, Georgia, serif" font-size="20.0" font-weight="bold" fill="#701c1a" text-anchor="middle">KNIFE SAFETY: PINCH GRIP AND CAT CLAW GUIDE HAND</text>
  <text x="400" y="54" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" fill="#5c5549" text-anchor="middle">The chef's foolproof biomechanics for fast, precision, and danger-free slicing.</text>

  <!-- Left Panel: Active Hand (Pinch Grip) -->
  <g transform="translate(40, 75)">
    <rect width="340" height="270" rx="8" fill="#ffffff" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="340" height="28" rx="8" fill="#701c1a"/>
    <text x="170" y="19" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" font-weight="bold" fill="#ffffff" text-anchor="middle">1. THE ACTIVE HAND: PINCH GRIP</text>

    <!-- Schematic knife diagram -->
    <g transform="translate(15, 38)">
      <path d="M 30 18 L 160 18 L 260 38 L 30 38 Z" fill="#f7f4eb" stroke="#5c5549" stroke-width="1.5"/>
      <rect x="10" y="13" width="35" height="30" rx="4" fill="#92400e" stroke="#5c5549" stroke-width="1.2"/>
      <circle cx="75" cy="28" r="13" fill="#faf7f2" stroke="#d4a373" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="75" y="32" font-family="Liberation Sans, Arial, sans-serif" font-size="11.9" font-weight="bold" fill="#701c1a" text-anchor="middle">Pinch</text>
    </g>

    <text x="14" y="105" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" font-weight="bold" fill="#701c1a">✗ Never hold the knife by the handle alone:</text>
    <text x="24" y="120" font-family="Liberation Sans, Arial, sans-serif" font-size="12.3" fill="#5c5549">The handle creates an unstable lever arm</text>
    <text x="24" y="134" font-family="Liberation Sans, Arial, sans-serif" font-size="12.3" fill="#5c5549">causing the blade to wobble, roll, and slip.</text>

    <text x="14" y="156" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" font-weight="bold" fill="#5a6e54">✓ The Virtuous Gesture:</text>
    <text x="24" y="171" font-family="Liberation Sans, Arial, sans-serif" font-size="12.3" fill="#242124">Firmly pinch the steel heel between the</text>
    <text x="24" y="185" font-family="Liberation Sans, Arial, sans-serif" font-size="12.3" fill="#242124"><tspan font-weight="bold">thumb</tspan> and the <tspan font-weight="bold">curled index finger</tspan>.</text>
    <text x="24" y="199" font-family="Liberation Sans, Arial, sans-serif" font-size="12.3" fill="#5c5549">Remaining three fingers wrap around the handle.</text>

    <rect x="14" y="215" width="312" height="38" rx="4" fill="#f4f6f4"/>
    <text x="170" y="230" font-family="Liberation Sans, Arial, sans-serif" font-size="11.9" font-weight="bold" fill="#5a6e54" text-anchor="middle">Direct control of the cutting axis,</text>
    <text x="170" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="11.9" fill="#5c5549" text-anchor="middle">zero vibrations, and minimal wrist fatigue.</text>
  </g>

  <!-- Right Panel: Guide Hand (Cat Claw) -->
  <g transform="translate(420, 75)">
    <rect width="340" height="270" rx="8" fill="#ffffff" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="340" height="28" rx="8" fill="#5a6e54"/>
    <text x="170" y="19" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" font-weight="bold" fill="#ffffff" text-anchor="middle">2. THE GUIDING HAND: THE CAT CLAW</text>

    <!-- Schematic Knuckles Shield -->
    <g transform="translate(60, 42)">
      <rect x="25" y="10" width="24" height="35" rx="5" fill="#f7f4eb" stroke="#5c5549" stroke-width="1.2"/>
      <rect x="58" y="6" width="24" height="39" rx="5" fill="#f7f4eb" stroke="#5c5549" stroke-width="1.2"/>
      <rect x="91" y="10" width="24" height="35" rx="5" fill="#f7f4eb" stroke="#5c5549" stroke-width="1.2"/>
      <line x1="10" y1="26" x2="135" y2="26" stroke="#a3432b" stroke-width="2"/>
      <text x="145" y="30" font-family="Liberation Sans, Arial, sans-serif" font-size="11.9" font-weight="bold" fill="#a3432b">Blade Fence</text>
    </g>

    <text x="14" y="105" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" font-weight="bold" fill="#242124">• Fingertips curled inward toward the palm:</text>
    <text x="24" y="120" font-family="Liberation Sans, Arial, sans-serif" font-size="12.3" fill="#5c5549">Nails and pulps completely tucked under.</text>
    <text x="24" y="134" font-family="Liberation Sans, Arial, sans-serif" font-size="12.3" fill="#5c5549">Zero risk of nicking an fingertip.</text>

    <text x="14" y="156" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" font-weight="bold" fill="#5a6e54">✓ The Second Knuckle Shield:</text>
    <text x="24" y="171" font-family="Liberation Sans, Arial, sans-serif" font-size="12.3" fill="#242124">The flat blade side glides against the vertical</text>
    <text x="24" y="185" font-family="Liberation Sans, Arial, sans-serif" font-size="12.3" fill="#242124">wall formed by curled second knuckles.</text>
    <text x="24" y="199" font-family="Liberation Sans, Arial, sans-serif" font-size="12.3" fill="#5c5549">The cutting edge shears food 1/2 in (1 cm) below.</text>

    <rect x="14" y="215" width="312" height="38" rx="4" fill="#f4f6f4"/>
    <text x="170" y="230" font-family="Liberation Sans, Arial, sans-serif" font-size="11.9" font-weight="bold" fill="#5a6e54" text-anchor="middle">Rapid, foolproof blind cutting:</text>
    <text x="170" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="11.9" fill="#5c5549" text-anchor="middle">the blade is physically incapable of reaching flesh.</text>
  </g>
</svg>
