<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <rect width="880" height="540" rx="14" fill="#FCFBF7" stroke="#DFDACF" stroke-width="2"/>
  <text x="440" y="34" font-family="Liberation Serif, Georgia, serif" font-size="20" font-weight="bold" fill="#701C1A" text-anchor="middle">KITCHEN SAFETY: THE 4 MAJOR ACCIDENTS &amp; RESCUE PROTOCOLS</text>
  <text x="440" y="55" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" fill="#5C5549" text-anchor="middle">Immediate reflexes and hazardous mistakes to avoid at all costs.</text>

  <!-- Bloc 1 : Panne de Frigo -->
  <g transform="translate(30, 72)">
    <rect width="395" height="210" rx="8" fill="#FAF7F2" stroke="#966C3B" stroke-width="1.5"/>
    <rect width="395" height="30" rx="8" fill="#6B4423"/>
    <text x="197" y="20" font-family="Liberation Serif, Georgia, serif" font-size="13.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">1. COLD CHAIN BLACKOUT (FRIDGE / FREEZER)</text>

    <text x="14" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5A6E54">✓ WHAT TO DO:</text>
    <text x="14" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Keep appliance doors tightly shut (4 to 6 hours thermal hold).</text>
    <text x="14" y="83" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• If temp &gt; 40°F (4°C) for &gt; 2 hrs: immediately cook</text>
    <text x="24" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">proteins to a core temp of 165°F to 212°F (74°C to 100°C).</text>
    <text x="14" y="115" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Thoroughly cooked food can then be safely refrozen.</text>

    <text x="14" y="140" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#701C1A">✗ ABSOLUTE PROHIBITION:</text>
    <text x="14" y="158" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#A3432B">• Never refreeze raw, thawed meats or fish!</text>
    <text x="14" y="175" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">Cellular exudates multiply bacterial expansion 100-fold,</text>
    <text x="14" y="190" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">producing heat-stable bacterial toxins.</text>
  </g>

  <!-- Bloc 2 : Poêle en Feu -->
  <g transform="translate(455, 72)">
    <rect width="395" height="210" rx="8" fill="#FAF7F2" stroke="#A3432B" stroke-width="1.5"/>
    <rect width="395" height="30" rx="8" fill="#701C1A"/>
    <text x="197" y="20" font-family="Liberation Serif, Georgia, serif" font-size="13.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">2. GREASE FIRE (BURNING COOKING OIL)</text>

    <text x="14" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5A6E54">✓ THE 3-SECOND LIFE-SAVING REFLEX:</text>
    <text x="14" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Immediately shut off the heat source (burner / induction).</text>
    <text x="14" y="83" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Slide a flat metal lid or damp wrung kitchen towel</text>
    <text x="24" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">over the pan from the side to smother oxygen.</text>
    <text x="14" y="115" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Leave to cool for 15 minutes; do not lift the lid.</text>

    <text x="14" y="140" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#701C1A">✗ FATAL MISTAKE:</text>
    <text x="14" y="158" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#A3432B">• Never throw water onto burning cooking oil!</text>
    <text x="14" y="175" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">Instant steam vaporization (1,700× volume explosion)</text>
    <text x="14" y="190" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">hurls burning grease into an explosive fireball (boilover).</text>
  </g>

  <!-- Bloc 3 : Brûlures Thermiques -->
  <g transform="translate(30, 300)">
    <rect width="395" height="215" rx="8" fill="#FAF7F2" stroke="#B45309" stroke-width="1.5"/>
    <rect width="395" height="30" rx="8" fill="#B45309"/>
    <text x="197" y="20" font-family="Liberation Serif, Georgia, serif" font-size="13.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">3. THERMAL SCALDS AND HOT CARAMEL BURNS</text>

    <text x="14" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5A6E54">✓ THE MEDICAL RULE OF THE THREE 15s:</text>
    <text x="14" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Eau tempérée à <tspan font-weight="bold">15°C</tspan> (jamais d'eau glacée ni glaçon).</text>
    <text x="14" y="83" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Flush for <tspan font-weight="bold">15 continuous minutes</tspan> to drain tissue heat.</text>
    <text x="14" y="100" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Hold <tspan font-weight="bold">6 in (15 cm)</tspan> beneath faucet under gentle laminar flow.</text>

    <text x="14" y="130" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#701C1A">✗ DANGEROUS MYTHS TO BAN:</text>
    <text x="14" y="148" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#A3432B">• Never apply butter, cooking oil, or toothpaste!</text>
    <text x="14" y="165" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">Fats form an insulating blanket that traps scorching</text>
    <text x="14" y="180" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">heat inside skin tissues, deepening second-degree burns.</text>
  </g>

  <!-- Bloc 4 : Coupures et Lame -->
  <g transform="translate(455, 300)">
    <rect width="395" height="215" rx="8" fill="#FAF7F2" stroke="#5A6E54" stroke-width="1.5"/>
    <rect width="395" height="30" rx="8" fill="#5A6E54"/>
    <text x="197" y="20" font-family="Liberation Serif, Georgia, serif" font-size="13.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">4. CHEF KNIFE CUTS &amp; SHARP EDGES</text>

    <text x="14" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5A6E54">✓ PREVENTIVE BIOMECHANICS:</text>
    <text x="14" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Main guide : doigts repliés en <tspan font-weight="bold">« griffe de chat »</tspan>,</text>
    <text x="24" y="81" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">flat blade gliding against second knuckles stop fence.</text>
    <text x="14" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Active hand: pinch grip on blade heel above handle.</text>

    <text x="14" y="130" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#701C1A">✗ IN CASE OF BLEEDING CUT:</text>
    <text x="14" y="148" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#A3432B">• Do not lick or lift compress every 30 seconds.</text>
    <text x="14" y="165" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">Rinse with cold water and clamp firm, continuous pressure</text>
    <text x="14" y="180" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">for 5 to 10 unbroken minutes to solidify fibrin clot.</text>
  </g>
</svg>