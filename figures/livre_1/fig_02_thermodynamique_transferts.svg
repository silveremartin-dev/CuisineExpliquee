<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="100%" height="100%">
  <rect width="800" height="410" rx="12" fill="#fcfbf7" stroke="#dfdacf" stroke-width="1.5"/>
  <text x="400" y="36" font-family="Liberation Serif, Georgia, serif" font-size="18" font-weight="bold" fill="#701c1a" text-anchor="middle">LES TROIS VECTEURS THERMODYNAMIQUES EN CUISINE</text>
  <text x="400" y="58" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5c5549" text-anchor="middle">Comment l'énergie thermique pénètre la matière alimentaire selon le milieu choisi.</text>
  
  <!-- 1. CONDUCTION -->
  <g transform="translate(30, 80)">
    <rect width="230" height="300" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="230" height="32" rx="8" fill="#701c1a"/>
    <text x="115" y="21" font-family="Liberation Serif, Georgia, serif" font-size="12" font-weight="bold" fill="#fcfbf7" text-anchor="middle">1. LA CONDUCTION SOLIDE</text>
    
    <rect x="25" y="158" width="180" height="18" fill="#383330" rx="3"/>
    <text x="115" y="171" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#fcfbf7" text-anchor="middle">Paroi métallique (Fonte / Inox)</text>
    
    <rect x="45" y="83" width="140" height="75" fill="#fbf6f5" stroke="#b06d60" stroke-width="1.5" rx="4"/>
    <rect x="45" y="143" width="140" height="15" fill="#701c1a" rx="2"/>
    <text x="115" y="154" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#fcfbf7" text-anchor="middle">Croûte de Maillard (&gt;140°C)</text>
    <text x="115" y="120" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" fill="#701c1a" text-anchor="middle" font-weight="bold">Cœur tendre (20–54°C)</text>
    
    <path d="M 65 208 L 65 182" stroke="#701c1a" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="65,177 61,185 69,185" fill="#701c1a"/>
    <path d="M 115 208 L 115 182" stroke="#701c1a" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="115,177 111,185 119,185" fill="#701c1a"/>
    <path d="M 165 208 L 165 182" stroke="#701c1a" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="165,177 161,185 169,185" fill="#701c1a"/>
    
    <text x="115" y="228" font-family="Liberation Serif, Georgia, serif" font-size="11" fill="#701c1a" font-weight="bold" text-anchor="middle">Loi de Fourier (Contact direct)</text>
    <text x="115" y="248" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#383330" text-anchor="middle">• Vibration de proche en proche</text>
    <text x="115" y="264" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#383330" text-anchor="middle">• Exige un film d'huile conducteur</text>
    <text x="115" y="286" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#701c1a" text-anchor="middle" font-weight="bold">Usage : Saisir, poêler, snacker</text>
  </g>
  
  <!-- 2. CONVECTION -->
  <g transform="translate(285, 80)">
    <rect width="230" height="300" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="230" height="32" rx="8" fill="#8c7355"/>
    <text x="115" y="21" font-family="Liberation Serif, Georgia, serif" font-size="12" font-weight="bold" fill="#fcfbf7" text-anchor="middle">2. LA CONVECTION FLUIDE</text>
    
    <rect x="35" y="65" width="160" height="110" rx="4" fill="#f4f6f4" stroke="#6e826b" stroke-width="1.5"/>
    <path d="M 65 145 C 50 115 55 85 85 85 C 105 85 105 130 85 145" fill="none" stroke="#5a6e54" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="85,148 80,140 88,140" fill="#5a6e54"/>
    <path d="M 165 145 C 180 115 175 85 145 85 C 125 85 125 130 145 145" fill="none" stroke="#a3432b" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="145,148 140,140 148,140" fill="#a3432b"/>
    
    <ellipse cx="115" cy="115" rx="26" ry="17" fill="#faf7f0" stroke="#d4a373" stroke-width="1.5"/>
    <text x="115" y="119" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549" text-anchor="middle">Œuf / Légume</text>
    
    <text x="115" y="202" font-family="Liberation Serif, Georgia, serif" font-size="11" fill="#5c5549" font-weight="bold" text-anchor="middle">Loi de Newton (Brassage fluide)</text>
    <text x="115" y="224" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#383330" text-anchor="middle">• Courants d'eau, d'huile ou d'air</text>
    <text x="115" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#383330" text-anchor="middle">• L'eau chauffe 25x plus vite que l'air</text>
    <text x="115" y="256" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#383330" text-anchor="middle">• Palier stable à 100°C dans l'eau</text>
    <text x="115" y="286" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#5a6e54" text-anchor="middle" font-weight="bold">Usage : Pocher, mijoter, vapeur</text>
  </g>
  
  <!-- 3. RAYONNEMENT -->
  <g transform="translate(540, 80)">
    <rect width="230" height="300" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="230" height="32" rx="8" fill="#a3432b"/>
    <text x="115" y="21" font-family="Liberation Serif, Georgia, serif" font-size="12" font-weight="bold" fill="#fcfbf7" text-anchor="middle">3. LE RAYONNEMENT IR</text>
    
    <rect x="30" y="55" width="170" height="16" rx="3" fill="#701c1a"/>
    <text x="115" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#fcfbf7" text-anchor="middle">Voûte / Braise rouge (800°C)</text>
    
    <path d="M 60 75 Q 65 95 60 115" fill="none" stroke="#d4a373" stroke-width="2"/>
    <polygon points="60,118 57,110 63,110" fill="#d4a373"/>
    <path d="M 115 75 Q 120 95 115 115" fill="none" stroke="#d4a373" stroke-width="2"/>
    <polygon points="115,118 112,110 118,110" fill="#d4a373"/>
    <path d="M 170 75 Q 175 95 170 115" fill="none" stroke="#d4a373" stroke-width="2"/>
    <polygon points="170,118 167,110 173,110" fill="#d4a373"/>
    
    <rect x="45" y="125" width="140" height="40" rx="4" fill="#faf6ee" stroke="#d4a373" stroke-width="1.5"/>
    <text x="115" y="149" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="bold">Surface dorée à sec</text>
    
    <text x="115" y="202" font-family="Liberation Serif, Georgia, serif" font-size="11" fill="#a3432b" font-weight="bold" text-anchor="middle">Ondes Infrarouges (Sans contact)</text>
    <text x="115" y="224" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#383330" text-anchor="middle">• Puissance explosive avec la braise</text>
    <text x="115" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#383330" text-anchor="middle">• Action sur le premier millimètre</text>
    <text x="115" y="256" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#383330" text-anchor="middle">• Attention : varie avec le carré</text>
    <text x="115" y="270" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#383330" text-anchor="middle">de la distance à la source !</text>
    <text x="115" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#a3432b" text-anchor="middle" font-weight="bold">Usage : Rôtir, griller, gratiner</text>
  </g>
</svg>
