<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <rect width="800" height="420" rx="12" fill="#fffdfa" stroke="#d4a373" stroke-width="1"/>
  <text x="400" y="38" font-family="Liberation Serif, Georgia, serif" font-size="20" font-weight="bold" fill="#701c1a" text-anchor="middle">LES TROIS VECTEURS THERMODYNAMIQUES EN CUISINE</text>
  <text x="400" y="62" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" fill="#5c5549" text-anchor="middle">Comment l'énergie cinétique microscopique pénètre la matière alimentaire.</text>
  
  <!-- 1. CONDUCTION -->
  <g transform="translate(30, 85)">
    <rect width="230" height="300" rx="8" fill="#faf7f2" stroke="#e6ded3" stroke-width="1"/>
    <rect x="0" y="0" width="230" height="32" rx="8" fill="#701c1a"/>
    <text x="115" y="21" font-family="Liberation Serif, Georgia, serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1. LA CONDUCTION SOLIDE</text>
    
    <rect x="25" y="160" width="180" height="18" fill="#3d3733" rx="3"/>
    <text x="115" y="173" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" fill="#ffffff" text-anchor="middle">Paroi métallique (Fonte / Inox)</text>
    
    <rect x="45" y="85" width="140" height="75" fill="#f5e6e3" stroke="#b06d60" stroke-width="1.5" rx="4"/>
    <rect x="45" y="145" width="140" height="15" fill="#701c1a" rx="2"/>
    <text x="115" y="156" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#fcfbf7" text-anchor="middle">Zone Maillard déshydratée (&gt;140°C)</text>
    <text x="115" y="125" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" fill="#5a1816" text-anchor="middle" font-weight="bold">Cœur cru (20°C)</text>
    
    <path d="M 60 215 L 60 185" stroke="#701c1a" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="60,180 56,188 64,188" fill="#701c1a"/>
    <path d="M 115 215 L 115 185" stroke="#701c1a" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="115,180 111,188 119,188" fill="#701c1a"/>
    <path d="M 170 215 L 170 185" stroke="#701c1a" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="170,180 166,188 174,188" fill="#701c1a"/>
    
    <text x="115" y="232" font-family="Liberation Serif, Georgia, serif" font-size="11" fill="#701c1a" font-weight="bold" text-anchor="middle">Flux de Fourier : q = -k ∇T</text>
    <text x="115" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#3d3733" text-anchor="middle">• Contact direct d'atome à atome</text>
    <text x="115" y="276" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#3d3733" text-anchor="middle">• Dépend de la diffusivité α</text>
    <text x="115" y="293" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#701c1a" text-anchor="middle" font-weight="bold">Application : Saisir, poêler</text>
  </g>
  
  <!-- 2. CONVECTION -->
  <g transform="translate(285, 85)">
    <rect width="230" height="300" rx="8" fill="#faf7f2" stroke="#e6ded3" stroke-width="1"/>
    <rect x="0" y="0" width="230" height="32" rx="8" fill="#a37a44"/>
    <text x="115" y="21" font-family="Liberation Serif, Georgia, serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">2. LA CONVECTION FLUIDE</text>
    
    <rect x="35" y="65" width="160" height="110" rx="4" fill="#f4f6f4" stroke="#8fa68c" stroke-width="1.5"/>
    <path d="M 65 145 C 50 115 55 85 85 85 C 105 85 105 130 85 145" fill="none" stroke="#5c6b55" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="85,148 80,140 88,140" fill="#5c6b55"/>
    <path d="M 165 145 C 180 115 175 85 145 85 C 125 85 125 130 145 145" fill="none" stroke="#a3432b" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="145,148 140,140 148,140" fill="#a3432b"/>
    
    <ellipse cx="115" cy="115" rx="22" ry="16" fill="#fdf6ec" stroke="#d4a373" stroke-width="1.5"/>
    <text x="115" y="119" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#734e1e" text-anchor="middle">Œuf / Légume</text>
    
    <text x="115" y="200" font-family="Liberation Serif, Georgia, serif" font-size="11" fill="#734e1e" font-weight="bold" text-anchor="middle">Loi de Newton : q = h · ΔT</text>
    <text x="115" y="222" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#3d3733" text-anchor="middle">• Déplacement macroscopique</text>
    <text x="115" y="238" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#3d3733" text-anchor="middle">• Eau : transfert x25 vs air calme</text>
    <text x="115" y="254" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#3d3733" text-anchor="middle">• Température uniforme 100°C</text>
    <text x="115" y="293" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#734e1e" text-anchor="middle" font-weight="bold">Application : Bouillir, pocher, vapeur</text>
  </g>
  
  <!-- 3. RAYONNEMENT -->
  <g transform="translate(540, 85)">
    <rect width="230" height="300" rx="8" fill="#faf7f2" stroke="#e6ded3" stroke-width="1"/>
    <rect x="0" y="0" width="230" height="32" rx="8" fill="#c2612a"/>
    <text x="115" y="21" font-family="Liberation Serif, Georgia, serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">3. LE RAYONNEMENT IR</text>
    
    <rect x="30" y="55" width="170" height="15" rx="3" fill="#a3432b"/>
    <text x="115" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#ffffff" text-anchor="middle">Résistance / Braise rouge (800°C)</text>
    
    <path d="M 60 75 Q 65 95 60 115" fill="none" stroke="#d4a373" stroke-width="2"/>
    <polygon points="60,118 57,110 63,110" fill="#d4a373"/>
    <path d="M 115 75 Q 120 95 115 115" fill="none" stroke="#d4a373" stroke-width="2"/>
    <polygon points="115,118 112,110 118,110" fill="#d4a373"/>
    <path d="M 170 75 Q 175 95 170 115" fill="none" stroke="#d4a373" stroke-width="2"/>
    <polygon points="170,118 167,110 173,110" fill="#d4a373"/>
    
    <rect x="50" y="125" width="130" height="40" rx="4" fill="#faebd7" stroke="#b06d60" stroke-width="1.5"/>
    <text x="115" y="149" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" fill="#522b14" text-anchor="middle" font-weight="bold">Surface rôtie à sec</text>
    
    <text x="115" y="200" font-family="Liberation Serif, Georgia, serif" font-size="11" fill="#c2612a" font-weight="bold" text-anchor="middle">Stefan-Boltzmann : q ∝ T⁴</text>
    <text x="115" y="222" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#3d3733" text-anchor="middle">• Aucun milieu matériel requis</text>
    <text x="115" y="238" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#3d3733" text-anchor="middle">• Pénétration superficielle (&lt;1 mm)</text>
    <text x="115" y="254" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#3d3733" text-anchor="middle">• Dessiccation éclair de croûte</text>
    <text x="115" y="293" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#c2612a" text-anchor="middle" font-weight="bold">Application : Rôtir, griller, salamandre</text>
  </g>
</svg>
