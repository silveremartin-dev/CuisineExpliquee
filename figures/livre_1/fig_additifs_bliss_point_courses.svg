<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400" y="36" font-family="Liberation Sans, Arial, sans-serif" font-size="22.8" font-weight="bold" fill="#0f172a" text-anchor="middle">L'INGÉNIERIE INDUSTRIELLE : LE BLISS POINT ET LES ADDITIFS E</text>
  <text x="400" y="58" font-family="Liberation Sans, Arial, sans-serif" font-size="16.2" fill="#64748b" text-anchor="middle">Démystifier les listes d'ingrédients, repérer les vrais poisons et déjouer le piège des courses.</text>

  <!-- Panneau Gauche : Le Triangle du Bliss Point -->
  <g transform="translate(40, 75)">
    <rect width="345" height="345" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="30" rx="12" fill="#dc2626"/>
    <text x="172" y="20" font-family="Liberation Sans, Arial, sans-serif" font-size="15.6" font-weight="bold" fill="#ffffff" text-anchor="middle">1. LE BLISS POINT : COURT-CIRCUITER LA SATIÉTÉ</text>

    <!-- Triangle équilatéral central -->
    <polygon points="172,60 70,195 275,195" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    
    <!-- Sommets -->
    <circle cx="172" cy="60" r="14" fill="#dc2626"/>
    <text x="172" y="64" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" font-weight="bold" fill="#ffffff" text-anchor="middle">SUCRE</text>

    <circle cx="70" cy="195" r="14" fill="#d97706"/>
    <text x="70" y="199" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" font-weight="bold" fill="#ffffff" text-anchor="middle">GRAS</text>

    <circle cx="275" cy="195" r="14" fill="#2563eb"/>
    <text x="275" y="199" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" font-weight="bold" fill="#ffffff" text-anchor="middle">SEL</text>

    <text x="172" y="140" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" font-weight="bold" fill="#991b1b" text-anchor="middle">DOPAMINE</text>
    <text x="172" y="155" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#7f1d1d" text-anchor="middle">(Addiction sensorielle)</text>

    <text x="20" y="235" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#334155"><tspan font-weight="bold">• L'illusion du craquant :</tspan> Les industriels calibrent</text>
    <text x="30" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#334155">la résistance mécanique (son acoustique de rupture à 300 Hz)</text>
    <text x="30" y="265" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#334155">pour déclencher une fausse sensation de fraîcheur.</text>
    <text x="20" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#334155"><tspan font-weight="bold">• Rétention d'eau :</tspan> Les polyphosphates retiennent jusqu'à</text>
    <text x="30" y="303" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#334155">30% d'eau ajoutée dans les jambons bas de gamme.</text>
    <text x="20" y="325" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" font-weight="bold" fill="#b91c1c">Résultat : Vous payez de l'eau au prix de la viande.</text>
  </g>

  <!-- Panneau Droit : Le Vrai/Faux des Additifs E et les Courses -->
  <g transform="translate(415, 75)">
    <rect width="345" height="345" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="30" rx="12" fill="#2563eb"/>
    <text x="172" y="20" font-family="Liberation Sans, Arial, sans-serif" font-size="15.6" font-weight="bold" fill="#ffffff" text-anchor="middle">2. ADDITIFS E : NATURELS vs RISQUES RÉELS</text>

    <!-- Inoffensifs -->
    <rect x="15" y="45" width="315" height="85" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="25" y="63" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" font-weight="bold" fill="#166534">✓ TOTALEMENT NATURELS &amp; INOFFENSIFS :</text>
    <text x="25" y="80" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#14532d">• <tspan font-weight="bold">E300</tspan> : Vitamine C (acide ascorbique, antioxydant).</text>
    <text x="25" y="95" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#14532d">• <tspan font-weight="bold">E330</tspan> : Acide citrique (présent dans le citron).</text>
    <text x="25" y="110" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#14532d">• <tspan font-weight="bold">E322</tspan> (Lécithine de soja/œuf) | <tspan font-weight="bold">E440</tspan> (Pectine de pomme).</text>

    <!-- Dangereux -->
    <rect x="15" y="140" width="315" height="100" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="25" y="158" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" font-weight="bold" fill="#991b1b">✗ LES VRAIS RISQUES À ÉVITER :</text>
    <text x="25" y="175" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#7f1d1d">• <tspan font-weight="bold">E250 (Nitrite de sodium) :</tspan> Forme des nitrosamines</text>
    <text x="35" y="188" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#7f1d1d">cancérogènes dans l'estomac (charcuteries roses industrielles).</text>
    <text x="25" y="203" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#7f1d1d">• <tspan font-weight="bold">E150d :</tspan> Caramel au sulfite d'ammonium (présence de 4-MEI).</text>
    <text x="25" y="218" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#7f1d1d">• <tspan font-weight="bold">E466 / E433 :</tspan> Émulsifiants synthétiques qui dégradent</text>
    <text x="35" y="231" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#7f1d1d">le mucus intestinal et favorisent l'inflammation colique.</text>

    <!-- La règle d'or des courses -->
    <rect x="15" y="250" width="315" height="80" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
    <text x="25" y="268" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" font-weight="bold" fill="#92400e">LE PIÈGE NEUROLOGIQUE DES COURSES :</text>
    <text x="25" y="285" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#78350f">• <tspan font-weight="bold">Courses le ventre vide :</tspan> Pic de ghréline qui pousse</text>
    <text x="35" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#78350f">le cerveau vers les produits ultra-transformés et les fringales.</text>
    <text x="25" y="315" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#15803d" font-weight="bold">Règle d'or : Faire ses courses le ventre plein avec une liste fermée !</text>
  </g>
</svg>