<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="100%" height="100%">
  <rect width="800" height="470" rx="14" fill="#fcfbf7" stroke="#e8e2d5" stroke-width="2"/>
  <text x="400" y="34" font-family="Liberation Serif, Georgia, serif" font-size="17" font-weight="bold" fill="#701c1a" text-anchor="middle">L'INGÉNIERIE INDUSTRIELLE : LE BLISS POINT ET LES ADDITIFS E</text>
  <text x="400" y="54" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5c5549" text-anchor="middle">Démystifier les étiquettes, repérer les vrais risques et déjouer les pièges d'achat.</text>

  <!-- Panneau Gauche : Le Triangle du Bliss Point -->
  <g transform="translate(40, 75)">
    <rect width="345" height="375" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="345" height="28" rx="8" fill="#701c1a"/>
    <text x="172" y="19" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1. LE BLISS POINT : COURT-CIRCUITER LA SATIÉTÉ</text>

    <!-- Triangle équilatéral central -->
    <polygon points="172,55 75,175 270,175" fill="#fbf6f5" stroke="#a3432b" stroke-width="1.5"/>

    <!-- Sommets -->
    <circle cx="172" cy="55" r="13" fill="#a3432b"/>
    <text x="172" y="59" font-family="Liberation Sans, Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">SUCRE</text>

    <circle cx="75" cy="175" r="13" fill="#d4a373"/>
    <text x="75" y="179" font-family="Liberation Sans, Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">GRAS</text>

    <circle cx="270" cy="175" r="13" fill="#5c5549"/>
    <text x="270" y="179" font-family="Liberation Sans, Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">SEL</text>

    <text x="172" y="125" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#701c1a" text-anchor="middle">DOPAMINE</text>
    <text x="172" y="139" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#5c5549" text-anchor="middle">(Court-circuit de satiété)</text>

    <text x="14" y="212" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#242124">• L'illusion du craquant acoustique :</text>
    <text x="24" y="226" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Rupture sonore calibrée à 300 Hz pour simuler</text>
    <text x="24" y="239" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">une fausse fraîcheur cellulaire en bouche.</text>

    <text x="14" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#242124">• Rétention d'eau par polyphosphates :</text>
    <text x="24" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Retiennent jusqu'à 30% d'eau ajoutée</text>
    <text x="24" y="287" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">dans les charcuteries industrielles d'entrée de gamme.</text>

    <text x="14" y="308" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#701c1a">• Le coût réel :</text>
    <text x="24" y="322" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Le consommateur achète de l'eau au prix du muscle.</text>

    <rect x="14" y="338" width="317" height="24" rx="4" fill="#faf0ee"/>
    <text x="172" y="353" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#701c1a" text-anchor="middle">Règle : Préférer le brut non texturé au transformé mou.</text>
  </g>

  <!-- Panneau Droit : Le Vrai/Faux des Additifs E et les Courses -->
  <g transform="translate(415, 75)">
    <rect width="345" height="375" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="345" height="28" rx="8" fill="#5c5549"/>
    <text x="172" y="19" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2. ADDITIFS E : NATURELS vs RISQUES RÉELS</text>

    <!-- Inoffensifs -->
    <rect x="14" y="38" width="317" height="92" rx="6" fill="#f4f6f4" stroke="#5a6e54" stroke-width="1"/>
    <text x="24" y="55" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5a6e54">✓ MOLÉCULES NATURELLES SANS DANGER :</text>
    <text x="24" y="72" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124"><tspan font-weight="bold">E300 (Vitamine C) :</tspan> Acide ascorbique antioxydant.</text>
    <text x="24" y="87" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124"><tspan font-weight="bold">E330 (Acide citrique) :</tspan> Naturellement présent en agrume.</text>
    <text x="24" y="102" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124"><tspan font-weight="bold">E322 (Lécithine) :</tspan> Lipide d'oeuf ou de soja.</text>
    <text x="24" y="117" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124"><tspan font-weight="bold">E440 (Pectine) :</tspan> Fibre naturelle gélifiante de pomme.</text>

    <!-- Dangereux -->
    <rect x="14" y="138" width="317" height="118" rx="6" fill="#fbf6f5" stroke="#a3432b" stroke-width="1"/>
    <text x="24" y="155" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#701c1a">✗ ADDITIFS CRITIQUES À ÉVITER :</text>
    <text x="24" y="172" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124"><tspan font-weight="bold">E250 (Nitrite de sodium) :</tspan> Forme des nitrosamines</text>
    <text x="34" y="185" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#5c5549">cancérogènes à la cuisson (charcuterie industrielle rose).</text>
    
    <text x="24" y="201" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124"><tspan font-weight="bold">E150d (Caramel ammoniacal) :</tspan> Contient du 4-MEI toxique.</text>
    
    <text x="24" y="217" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124"><tspan font-weight="bold">E466 / E433 (Émulsifiants synthétiques) :</tspan></text>
    <text x="34" y="230" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#5c5549">Altèrent le mucus intestinal et entretiennent l'inflammation.</text>
    <text x="24" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124"><tspan font-weight="bold">E621 (Glutamate de synthèse à haute dose) :</tspan> Cache l'indigence.</text>

    <!-- La règle d'or des courses -->
    <rect x="14" y="264" width="317" height="98" rx="6" fill="#fcf8f2" stroke="#d4a373" stroke-width="1"/>
    <text x="24" y="281" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#701c1a">LE PIÈGE NEUROLOGIQUE DU CADDIE :</text>
    <text x="24" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124">• Courses le ventre vide = pic de ghréline :</text>
    <text x="34" y="311" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#5c5549">Le cerveau primitif fonce vers le sucre rapide et le gras.</text>
    <text x="24" y="327" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124">• Usage rationnel de Yuka &amp; Nutri-Score :</text>
    <text x="34" y="340" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#5c5549">Utiles pour éliminer les ultra-transformés, pas pour remplacer le bon sens.</text>
    <text x="24" y="354" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#5a6e54">Règle : Acheter brut, le ventre plein, avec une liste stricte.</text>
  </g>
</svg>
