<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <rect width="880" height="500" rx="14" fill="#FCFBF7" stroke="#DFDACF" stroke-width="2"/>
  <text x="440" y="34" font-family="Liberation Serif, Georgia, serif" font-size="20" font-weight="bold" fill="#701C1A" text-anchor="middle">PASTA THERMODYNAMICS &amp; THE GOLDEN CARBONARA EMULSION</text>
  <text x="440" y="55" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" fill="#5C5549" text-anchor="middle">Starch gelatinization, the 100 / 10 / 1 rule, and colloidal binding without cream.</text>

  <!-- Panneau Gauche : Règle 100 / 10 / 1 -->
  <g transform="translate(30, 75)">
    <rect width="395" height="400" rx="10" fill="#FAF7F2" stroke="#966C3B" stroke-width="1.5"/>
    <rect width="395" height="32" rx="10" fill="#6B4423"/>
    <text x="197" y="21" font-family="Liberation Serif, Georgia, serif" font-size="13.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">1. THE PASTA EQUATION: 100 g / 10 g / 1 L</text>

    <text x="16" y="54" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" fill="#242124"><tspan font-weight="bold" fill="#6B4423">• Canonical Ratio:</tspan> 3.5 oz (100 g) pasta, 10 g salt, 1 qt (1 L) water.</text>
    <text x="16" y="74" font-family="Liberation Sans, Arial, sans-serif" font-size="12.0" fill="#5C5549">Massive water volume guarantees boiling stability (212°F / 100°C)</text>
    <text x="16" y="90" font-family="Liberation Sans, Arial, sans-serif" font-size="12.0" fill="#5C5549">and dilutes liberated amylose to prevent sticking.</text>

    <text x="16" y="118" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5A6E54">✓ THE VIRTUOUS GESTURE:</text>
    <text x="20" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">1. Plunge into vigorously rolling salted water (212°F / 100°C).</text>
    <text x="20" y="156" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">2. Stir continuously during the critical first 30 seconds.</text>
    <text x="20" y="174" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">3. Cuire <tspan font-style="italic">al dente</tspan> : cœur de gluten ferme (IG modéré).</text>
    <text x="20" y="192" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#B45309">4. Reserve 1 ladle of cloudy, starch-rich pasta water</text>
    <text x="34" y="208" font-family="Liberation Sans, Arial, sans-serif" font-size="12.0" fill="#5C5549">before draining to bind and emulsify the pan sauce!</text>

    <text x="16" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#701C1A">✗ THE THREE CARDINAL MISTAKES:</text>
    <text x="20" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• <tspan font-weight="bold" fill="#701C1A">Pouring oil into water:</tspan> floats on surface,</text>
    <text x="30" y="276" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">then coats drained pasta, making pan sauces slide off.</text>
    <text x="20" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• <tspan font-weight="bold" fill="#701C1A">Rinsing pasta under tap:</tspan> washes away the surface</text>
    <text x="30" y="314" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">amylose coating essential for sauce adhesion.</text>
    <text x="20" y="336" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• <tspan font-weight="bold" fill="#701C1A">Overcooking:</tspan> breaks down gluten matrix and doubles</text>
    <text x="30" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">blood glucose absorption kinetics (insulin spike).</text>
  </g>

  <!-- Panneau Droit : Émulsion Carbonara -->
  <g transform="translate(455, 75)">
    <rect width="395" height="400" rx="10" fill="#FAF7F2" stroke="#B45309" stroke-width="1.5"/>
    <rect width="395" height="32" rx="10" fill="#B45309"/>
    <text x="197" y="21" font-family="Liberation Serif, Georgia, serif" font-size="13.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">2. CARBONARA: CRITICAL WINDOW (144°F to 149°F / 62°C to 65°C)</text>

    <rect x="20" y="48" width="355" height="95" rx="6" fill="#F2ECE1" stroke="#B45309" stroke-width="1.2"/>
    <text x="197" y="68" font-family="Liberation Serif, Georgia, serif" font-size="13" font-weight="bold" fill="#701C1A" text-anchor="middle">THE COLLOIDAL EQUATION WITHOUT CREAM</text>
    <text x="197" y="88" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124" text-anchor="middle">Egg yolks (Lecithin) + Grated aged Pecorino</text>
    <text x="197" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124" text-anchor="middle">+ Rendered Guanciale fat + Starchy water (147°F / 64°C)</text>
    <text x="197" y="126" font-family="Liberation Serif, Georgia, serif" font-size="12.5" font-weight="bold" fill="#B45309" text-anchor="middle">= Glossy golden sauce coating every pasta strand</text>

    <text x="16" y="168" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5A6E54">✓ OFF-THE-HEAT PROTOCOL:</text>
    <text x="20" y="188" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">1. Sauté guanciale gently until rendered and crispy amber.</text>
    <text x="20" y="206" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">2. Whisk yolks + Pecorino + cracked black pepper</text>
    <text x="34" y="222" font-family="Liberation Sans, Arial, sans-serif" font-size="12.0" fill="#5C5549">with a spoonful of warm starchy cooking water.</text>
    <text x="20" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#701C1A">3. Take skillet off the heat; wait 30 seconds for the metal</text>
    <text x="34" y="256" font-family="Liberation Sans, Arial, sans-serif" font-size="12.0" fill="#5C5549">temperature to drop below the 154°F (68°C) threshold.</text>
    <text x="20" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">4. Pour egg mixture over pasta; toss and stir vigorously.</text>

    <rect x="20" y="298" width="355" height="82" rx="6" fill="#FBF6F5" stroke="#A3432B" stroke-width="1"/>
    <text x="197" y="318" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#701C1A" text-anchor="middle">✗ THE DIRECT HEAT DISASTER (&gt; 158°F / 70°C):</text>
    <text x="197" y="338" font-family="Liberation Sans, Arial, sans-serif" font-size="12.0" fill="#242124" text-anchor="middle">Yolk ovalbumins instantly curdle into dry, granular</text>
    <text x="197" y="354" font-family="Liberation Sans, Arial, sans-serif" font-size="12.0" fill="#242124" text-anchor="middle">scrambled egg clumps instead of emulsifying.</text>
  </g>
</svg>