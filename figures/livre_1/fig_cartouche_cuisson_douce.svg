<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" height="100%">
  <rect width="760" height="300" rx="14" fill="#fcfbf7" stroke="#e8e2d5" stroke-width="2"/>
  
  <text x="380" y="30" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#701c1a" text-anchor="middle">LE CARTOUCHE DE PAPIER SULFURISÉ : LE SECRET DU GLAÇAGE</text>
  <text x="380" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5c5549" text-anchor="middle">Régulation millimétrique de l'évaporation sans condensation parasite.</text>

  <!-- Cheminée et vapeur -->
  <path d="M 370 80 Q 375 60 380 80 T 390 60" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 380 90 Q 385 70 390 90 T 400 70" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="105" font-family="Liberation Sans, Arial, sans-serif" font-size="9" font-weight="bold" fill="#0284c7" text-anchor="middle">Cheminée centrale (Ø 1 cm) : Échappement doux de vapeur</text>

  <!-- Le disque de papier cartouche -->
  <rect x="100" y="120" width="560" height="18" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="380" y="133" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#854d0e" text-anchor="middle">Disque de papier sulfurisé beurré au contact direct des légumes</text>

  <!-- Légumes dessous -->
  <g transform="translate(120, 160)">
    <!-- Carotte 1 -->
    <ellipse cx="60" cy="30" rx="30" ry="16" fill="#fb923c" stroke="#ea580c" stroke-width="1.5"/>
    <!-- Carotte 2 -->
    <ellipse cx="140" cy="30" rx="32" ry="16" fill="#fb923c" stroke="#ea580c" stroke-width="1.5"/>
    <!-- Poireau -->
    <rect x="200" y="16" width="70" height="26" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
    <!-- Carotte 3 -->
    <ellipse cx="320" cy="30" rx="30" ry="16" fill="#fb923c" stroke="#ea580c" stroke-width="1.5"/>
    <!-- Navet -->
    <circle cx="400" cy="30" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Carotte 4 -->
    <ellipse cx="470" cy="30" rx="30" ry="16" fill="#fb923c" stroke="#ea580c" stroke-width="1.5"/>
  </g>

  <!-- Fond de casserole et sirop -->
  <rect x="90" y="220" width="580" height="10" rx="2" fill="#d97706"/>
  <text x="380" y="248" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#b45309" text-anchor="middle">Fond de casserole : Sirop beurré concentré (sucres végétaux + lipides émulsionnés)</text>
  <text x="380" y="265" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#5c5549" text-anchor="middle">Les protopectines gélifient à 85°C sans défaire la forme : glaçage à blanc brillant et fondant absolu.</text>

  <!-- Parois de la casserole -->
  <line x1="90" y1="90" x2="90" y2="230" stroke="#64748b" stroke-width="4"/>
  <line x1="670" y1="90" x2="670" y2="230" stroke="#64748b" stroke-width="4"/>
  <line x1="88" y1="230" x2="672" y2="230" stroke="#64748b" stroke-width="4"/>
</svg>
