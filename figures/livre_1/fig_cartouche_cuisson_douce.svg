<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 295" width="100%" height="100%">
  <rect width="760" height="295" rx="12" fill="#fcfbf7" stroke="#dfdacf" stroke-width="1.5"/>
  
  <text x="380" y="30" font-family="Liberation Serif, Georgia, serif" font-size="16" font-weight="bold" fill="#701c1a" text-anchor="middle">LE CARTOUCHE DE PAPIER SULFURISÉ : LE SECRET DU GLAÇAGE</text>
  <text x="380" y="49" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5c5549" text-anchor="middle">Régulation millimétrique de l'évaporation sans retombée d'eau de condensation.</text>

  <!-- Cheminée et vapeur -->
  <path d="M 368 84 Q 373 64 378 84 T 388 64" fill="none" stroke="#8c7355" stroke-width="2"/>
  <path d="M 382 90 Q 387 70 392 90 T 402 70" fill="none" stroke="#8c7355" stroke-width="2"/>
  <text x="380" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#701c1a" text-anchor="middle">Cheminée centrale (Ø 1 cm) : Échappement lent et régulé de la vapeur</text>

  <!-- Le disque de papier cartouche -->
  <rect x="105" y="118" width="550" height="20" rx="4" fill="#f2ece1" stroke="#d4a373" stroke-width="1.5"/>
  <text x="380" y="132" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5c5549" text-anchor="middle">Disque de papier sulfurisé beurré posé au contact direct des légumes</text>

  <!-- Légumes dessous -->
  <g transform="translate(125, 155)">
    <ellipse cx="55" cy="28" rx="30" ry="15" fill="#d4a373" stroke="#a3432b" stroke-width="1.5"/>
    <ellipse cx="135" cy="28" rx="32" ry="15" fill="#d4a373" stroke="#a3432b" stroke-width="1.5"/>
    <rect x="195" y="15" width="68" height="25" rx="6" fill="#f4f6f4" stroke="#5a6e54" stroke-width="1.5"/>
    <ellipse cx="315" cy="28" rx="30" ry="15" fill="#d4a373" stroke="#a3432b" stroke-width="1.5"/>
    <circle cx="390" cy="28" r="16" fill="#faf7f0" stroke="#8c7355" stroke-width="1.5"/>
    <ellipse cx="458" cy="28" rx="30" ry="15" fill="#d4a373" stroke="#a3432b" stroke-width="1.5"/>
  </g>

  <!-- Fond de casserole et sirop -->
  <rect x="95" y="212" width="570" height="10" rx="2" fill="#d4a373"/>
  <text x="380" y="244" font-family="Liberation Serif, Georgia, serif" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">Fond de casserole : Réduction en sirop brillant (sucres végétaux + beurre émulsionné)</text>
  <text x="380" y="263" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#5c5549" text-anchor="middle">Les pectines s'attendrissent à 85°C sans bouillir : glaçage à blanc soyeux et fondant intact.</text>

  <!-- Parois de la casserole -->
  <line x1="95" y1="88" x2="95" y2="224" stroke="#5c5549" stroke-width="4"/>
  <line x1="665" y1="88" x2="665" y2="224" stroke="#5c5549" stroke-width="4"/>
  <line x1="93" y1="224" x2="667" y2="224" stroke="#5c5549" stroke-width="4"/>
</svg>
