<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <rect width="800" height="460" rx="14" fill="#fcfbf7" stroke="#dfdacf" stroke-width="2"/>
  <text x="400" y="34" font-family="Liberation Serif, Georgia, serif" font-size="17" font-weight="bold" fill="#701c1a" text-anchor="middle">L'ANATOMIE INVISIBLE D'UNE ASSIETTE TROIS ÉTOILES</text>
  <text x="400" y="54" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5c5549" text-anchor="middle">Ce qui change réellement la flaveur au-delà du décorum de salle.</text>

  <!-- Assiette Centrale stylisée -->
  <g transform="translate(130, 245)">
    <circle cx="0" cy="0" r="105" fill="#ffffff" stroke="#dfdacf" stroke-width="3"/>
    <circle cx="0" cy="0" r="75" fill="#fbf6f5" stroke="#d4a373" stroke-width="1.2" stroke-dasharray="3,3"/>

    <!-- Cordon de Sauce Glacée -->
    <path d="M -45 30 C -15 55 25 45 48 15 C 55 -12 20 -38 -12 -30 C -38 -22 -55 8 -45 30 Z" fill="#d4a373" opacity="0.35"/>

    <!-- Pièce principale dorée (Maillard) -->
    <rect x="-30" y="-18" width="60" height="36" rx="5" fill="#f7f4eb" stroke="#a3432b" stroke-width="1.5"/>
    <line x1="-25" y1="-8" x2="25" y2="-8" stroke="#a3432b" stroke-width="1"/>
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#a3432b" stroke-width="1"/>
    <line x1="-25" y1="8" x2="25" y2="8" stroke="#a3432b" stroke-width="1"/>

    <circle cx="-12" cy="-24" r="3.5" fill="#5a6e54"/>
    <circle cx="12" cy="-24" r="3.5" fill="#5a6e54"/>

    <text x="0" y="4" font-family="Liberation Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#701c1a" text-anchor="middle">ÉQUILIBRE</text>
    <text x="0" y="16" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549" text-anchor="middle">TOTAL</text>
  </g>

  <!-- Les 5 Vérités Physiques du Grand Restaurant -->
  <g transform="translate(280, 75)">
    <!-- Vérité 1 : Le Sel Multi-Strate -->
    <rect width="485" height="65" rx="6" fill="#ffffff" stroke="#dfdacf" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="65" rx="3" fill="#5c5549"/>
    <text x="18" y="20" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#242124">1. LE SEL MULTI-STRATE (DYNAMIQUE OSMOTIQUE)</text>
    <text x="18" y="36" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">Saler à chaque métamorphose : eau de pochage, saumure courte,</text>
    <text x="18" y="50" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">réduction de jus et fleur croustillante au moment du dressage.</text>

    <!-- Vérité 2 : L'Acide Invisible -->
    <rect y="75" width="485" height="65" rx="6" fill="#ffffff" stroke="#dfdacf" stroke-width="1"/>
    <rect y="75" x="0" width="6" height="65" rx="3" fill="#5a6e54"/>
    <text x="18" y="95" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#5a6e54">2. L'ACIDE ÉQUILIBRANT (« COUPE-GRAS » INVISIBLE)</text>
    <text x="18" y="111" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">Un trait de vinaigre vieux ou d'agrume dans une sauce riche :</text>
    <text x="18" y="125" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">stimule la salivation salivaire sans imposer de goût acide décelable.</text>

    <!-- Vérité 3 : Concentration Umami & Collagène -->
    <rect y="150" width="485" height="65" rx="6" fill="#ffffff" stroke="#dfdacf" stroke-width="1"/>
    <rect y="150" x="0" width="6" height="65" rx="3" fill="#d4a373"/>
    <text x="18" y="170" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">3. RÉDUCTION ET HYDROLYSE DU COLLAGÈNE</text>
    <text x="18" y="186" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">Les sucs bruns réduits en glaces soyeuses nappent le palais</text>
    <text x="18" y="200" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">grâce aux protéines de gélatine qui fixent les esters aromatiques.</text>

    <!-- Vérité 4 : Filtration mécanique -->
    <rect y="225" width="485" height="65" rx="6" fill="#ffffff" stroke="#dfdacf" stroke-width="1"/>
    <rect y="225" x="0" width="6" height="65" rx="3" fill="#701c1a"/>
    <text x="18" y="245" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#701c1a">4. LE CHINOIS ÉTAMINE FIN ET LE SOYEUX</text>
    <text x="18" y="261" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">Passage systématique au tamis pour éliminer toute fibre rugueuse :</text>
    <text x="18" y="275" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">la texture en bouche conditionne 80% de l'impression de luxe culinaire.</text>

    <!-- Vérité 5 : Contraste Poly-textural -->
    <rect y="300" width="485" height="65" rx="6" fill="#ffffff" stroke="#dfdacf" stroke-width="1"/>
    <rect y="300" x="0" width="6" height="65" rx="3" fill="#a3432b"/>
    <text x="18" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#a3432b">5. L'ÉQUATION POLY-TEXTURALE DE LA BOUCHÉE</text>
    <text x="18" y="336" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">La bouchée parfaite réunit simultanément 3 à 4 textures :</text>
    <text x="18" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="9" font-weight="bold" fill="#701c1a">Croustillant (croûte) + Moelleux (chair) + Soyeux (sauce émulsionnée).</text>
  </g>
</svg>
