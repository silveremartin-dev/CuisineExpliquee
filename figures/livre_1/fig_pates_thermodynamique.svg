<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <rect width="840" height="460" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="420" y="38" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">LE GESTE AU MICROSCOPE : LES PÂTES ET L'INCENDIE D'HUILE</text>
  <text x="420" y="62" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">La physique du quotidien : gélatinisation de l'amidon et réaction d'urgence au feu gras.</text>

  <!-- Volet Gauche : Cuisson des pâtes -->
  <g transform="translate(30, 85)">
    <rect width="375" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="375" height="32" rx="12" fill="#2563eb"/>
    <text x="187" y="21" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">L'ÉQUATION DES PÂTES : 100 / 10 / 1</text>
    
    <text x="20" y="54" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" fill="#1e3a8a"><tspan font-weight="bold">• Règle des trois :</tspan> 100 g de pâtes / 10 g de sel / 1 L d'eau.</text>
    <text x="20" y="72" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#334155"><tspan font-weight="bold">• Pourquoi tant d'eau ?</tspan> Diluer l'amidon expulsé qui rendrait</text>
    <text x="30" y="87" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#334155">l'eau visqueuse, et amortir la chute thermique à l'immersion.</text>

    <text x="20" y="112" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#15803d"><tspan font-weight="bold">✓ CE QU'IL FAUT FAIRE :</tspan></text>
    <text x="25" y="129" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#166534">1. Plonger impérativement dans l'eau à gros bouillons (100°C).</text>
    <text x="25" y="145" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#166534">2. Couvrir 30 secondes pour relancer l'ébullition puis découvrir.</text>
    <text x="25" y="161" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#166534">3. Cuire <tspan font-style="italic">al dente</tspan> : préserve l'amidon résistant (index bas).</text>
    <text x="25" y="177" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#166534">4. <tspan font-weight="bold">Conserver 1 louche d'eau de cuisson</tspan> riche en amylose libre.</text>
    <text x="25" y="193" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#166534">5. Monter l'émulsion finale directement avec cette eau chaude.</text>

    <text x="20" y="222" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#b91c1c"><tspan font-weight="bold">✗ CE QU'IL FAUT ABSOLUMENT ÉVITER :</tspan></text>
    <text x="25" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#991b1b">• <tspan font-weight="bold">Mettre de l'huile dans l'eau :</tspan> flotte en surface, puis nappe</text>
    <text x="35" y="255" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#7f1d1d">les pâtes à l'égouttage en empêchant la sauce d'adhérer !</text>
    <text x="25" y="273" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#991b1b">• <tspan font-weight="bold">Rincer les pâtes sous l'eau froide :</tspan> lessive l'amidon collant,</text>
    <text x="35" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#7f1d1d">glace la chair et détruit tout pouvoir de liaison avec le condiment.</text>
    <text x="25" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#991b1b">• <tspan font-weight="bold">Surcuire en pâte molle :</tspan> fait exploser l'index glycémique.</text>
  </g>

  <!-- Volet Droit : Incendie de poêle -->
  <g transform="translate(435, 85)">
    <rect width="375" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="375" height="32" rx="12" fill="#dc2626"/>
    <text x="187" y="21" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">URGENCE : L'HUILE EN FLAMMES DANS LA POÊLE</text>
    
    <rect x="20" y="44" width="335" height="88" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="187" y="62" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">LE PIÈGE MORTEL DU VERRE D'EAU</text>
    <text x="30" y="80" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#7f1d1d">1. L'eau (d=1,0) coule sous l'huile brûlante (d=0,92 à 300°C).</text>
    <text x="30" y="96" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#7f1d1d">2. L'eau se vaporise instantanément : <tspan font-weight="bold">expansion x 1 700</tspan> !</text>
    <text x="30" y="112" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#b91c1c" font-weight="bold">3. L'aérosol pulvérisé s'enflamme : boule de feu géante.</text>

    <text x="20" y="152" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#15803d"><tspan font-weight="bold">✓ LE SEUL GESTE CORRECT (EN 3 SECONDES) :</tspan></text>
    <text x="25" y="171" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#166534">1. <tspan font-weight="bold">Couper la source thermique</tspan> (gaz ou plaque électrique).</text>
    <text x="25" y="188" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#166534">2. <tspan font-weight="bold">Faire glisser un couvercle métallique</tspan> par le côté.</text>
    <text x="35" y="203" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#15803d">(Ou un torchon mouillé et vigoureusement essoré).</text>
    <text x="25" y="221" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#166534">3. <tspan font-weight="bold">Ne plus toucher :</tspan> attendre 10 min de refroidissement sous 360°C.</text>

    <rect x="20" y="248" width="335" height="75" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="187" y="270" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">Principe physique d'extinction :</text>
    <text x="187" y="289" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#78350f" text-anchor="middle">Supprimer le comburant ($O_2$) par étouffement mécanique,</text>
    <text x="187" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#78350f" text-anchor="middle">sans disperser les gouttelettes de combustible en fusion.</text>
  </g>
</svg>
