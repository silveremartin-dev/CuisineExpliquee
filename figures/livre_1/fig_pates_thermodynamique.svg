<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <rect width="800" height="440" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400" y="38" font-family="Liberation Sans, Arial, sans-serif" font-size="22.8" font-weight="bold" fill="#0f172a" text-anchor="middle">LE GESTE AU MICROSCOPE : LES PÂTES ET L'INCENDIE D'HUILE</text>
  <text x="400" y="62" font-family="Liberation Sans, Arial, sans-serif" font-size="16.9" fill="#64748b" text-anchor="middle">La physique du quotidien : gélatinisation de l'amidon et réaction d'urgence au feu gras.</text>
  <g transform="translate(40, 85)">
    <rect width="345" height="325" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="30" rx="12" fill="#2563eb"/>
    <text x="172" y="20" font-family="Liberation Sans, Arial, sans-serif" font-size="15.6" font-weight="bold" fill="#ffffff" text-anchor="middle">L'ÉQUATION DES PÂTES : 100 / 10 / 1</text>
    <text x="20" y="55" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" fill="#1e3a8a"><tspan font-weight="bold">• Proportions :</tspan> 100 g de pâtes, 10 g de sel, 1 L d'eau.</text>
    <text x="20" y="75" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#334155"><tspan font-weight="bold">• Pourquoi tant d'eau ?</tspan> Éviter la saturation en amidon dissous</text>
    <text x="32" y="90" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#334155">qui rend l'eau collante et effondre la température au plongeon.</text>
    <text x="20" y="115" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" fill="#15803d"><tspan font-weight="bold">✓ CE QU'IL FAUT FAIRE :</tspan></text>
    <text x="25" y="132" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#166534">1. Jeter dans une eau à bouillon VIF (100°C).</text>
    <text x="25" y="148" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#166534">2. Couvrir 30 secondes pour relancer l'ébullition puis ôter.</text>
    <text x="25" y="164" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#166534">3. Cuire <tspan font-style="italic">al dente</tspan> (cœur légèrement résistant, index glycémique bas).</text>
    <text x="25" y="180" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#166534">4. <tspan font-weight="bold">Garder 1 louche d'eau de cuisson</tspan> riche en amylose dissous !</text>
    <text x="25" y="196" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#166534">5. Émulsionner la sauce directement avec l'eau des pâtes.</text>
    <text x="20" y="224" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" fill="#b91c1c"><tspan font-weight="bold">✗ CE QU'IL FAUT ABSOLUMENT ÉVITER :</tspan></text>
    <text x="25" y="242" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#991b1b">• <tspan font-weight="bold">Mettre de l'huile dans l'eau :</tspan> l'huile flotte en surface (inutile),</text>
    <text x="35" y="256" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#7f1d1d">puis enrobe les pâtes à l'égouttage, empêchant la sauce d'adhérer !</text>
    <text x="25" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#991b1b">• <tspan font-weight="bold">Rincer les pâtes cuites sous l'eau :</tspan> rince l'amidon de surface,</text>
    <text x="35" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#7f1d1d">glace les pâtes et détruit toute liaison avec le condiment.</text>
    <text x="25" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#991b1b">• <tspan font-weight="bold">Surcuire en pâte molle :</tspan> double l'index glycémique (pic d'insuline).</text>
  </g>
  <g transform="translate(415, 85)">
    <rect width="345" height="325" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="30" rx="12" fill="#dc2626"/>
    <text x="172" y="20" font-family="Liberation Sans, Arial, sans-serif" font-size="15.6" font-weight="bold" fill="#ffffff" text-anchor="middle">URGENCE : L'HUILE EN FLAMMES DANS LA POÊLE</text>
    <rect x="25" y="45" width="295" height="95" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="172" y="65" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" font-weight="bold" fill="#991b1b" text-anchor="middle">LE PIÈGE MORTEL DU VERRE D'EAU</text>
    <text x="35" y="85" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#7f1d1d">1. L'eau (d=1,0) coule sous l'huile brûlante (d=0,92 à 300°C).</text>
    <text x="35" y="100" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#7f1d1d">2. L'eau se vaporise instantanément : <tspan font-weight="bold">expansion x 1 700</tspan> !</text>
    <text x="35" y="115" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#b91c1c" font-weight="bold">3. L'explosion pulvérise l'huile en aérosol : boule de feu de 2 mètres.</text>
    <text x="20" y="160" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" fill="#15803d"><tspan font-weight="bold">✓ LE SEUL GESTE CORRECT (EN 3 SECONDES) :</tspan></text>
    <text x="25" y="180" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#166534">1. <tspan font-weight="bold">Couper la source de chaleur</tspan> (gaz ou plaque immédiatement).</text>
    <text x="25" y="198" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#166534">2. <tspan font-weight="bold">Faire glisser un couvercle métallique</tspan> ou une plaque sur la poêle.</text>
    <text x="35" y="213" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#15803d">(À défaut : poser un torchon mouillé et TRÈS FORTEMENT essoré).</text>
    <text x="25" y="231" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#166534">3. <tspan font-weight="bold">Ne plus toucher</tspan> et attendre 10 minutes que la température</text>
    <text x="35" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#15803d">redescende sous le point d'auto-inflammation (360°C).</text>
    <rect x="25" y="265" width="295" height="45" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="172" y="283" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" font-weight="bold" fill="#92400e" text-anchor="middle">Principe physique de neutralisation :</text>
    <text x="172" y="299" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#78350f" text-anchor="middle">Supprimer le comburant (O₂) sans disperser le combustible (huile).</text>
  </g>
</svg>