<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <rect width="800" height="360" rx="16" fill="#fcfbf7" stroke="#e8e2d5" stroke-width="2"/>
  
  <!-- Titre -->
  <text x="400" y="32" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#701c1a" text-anchor="middle">SÉCURITÉ DU COUTEAU : LA PRISE EN PINCE ET LA MAIN EN GRIFFE</text>
  <text x="400" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5c5549" text-anchor="middle">La biomécanique infaillible du chef pour découper rapidement à l'aveugle sans jamais se couper.</text>

  <!-- Volet Gauche : Main Active (Prise en pince) -->
  <g transform="translate(40, 75)">
    <rect width="340" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="30" rx="10" fill="#1e3a8a"/>
    <text x="170" y="20" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1. LA MAIN ACTIVE : LA PRISE EN PINCE (PINCH GRIP)</text>
    
    <!-- Schéma Schématique du Couteau -->
    <path d="M 30 70 L 160 70 L 260 90 L 30 90 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <rect x="20" y="65" width="40" height="30" rx="4" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>
    <!-- Zone de pincement -->
    <circle cx="80" cy="80" r="14" fill="#fef08a" stroke="#ca8a04" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="80" y="84" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#854d0e" text-anchor="middle">Pince</text>

    <text x="15" y="130" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1e3a8a">• Ne jamais tenir le couteau uniquement par le manche :</text>
    <text x="15" y="148" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#334155">Tenir le manche crée un bras de levier instable qui fait basculer la lame.</text>
    <text x="15" y="172" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1e3a8a">• Le Geste Vertueux :</text>
    <text x="15" y="190" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#334155">Pincez fermement le talon d'acier entre le <tspan font-weight="bold">pouce</tspan> et l'<tspan font-weight="bold">index replié</tspan>.</text>
    <text x="15" y="206" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#334155">Les trois autres doigts enroulent souplement la garde.</text>
    <text x="15" y="232" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#166534">→ Contrôle absolu de l'angle et suppression de toute vibration.</text>
  </g>

  <!-- Volet Droit : Main Passive (La griffe de chat) -->
  <g transform="translate(420, 75)">
    <rect width="340" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="30" rx="10" fill="#047857"/>
    <text x="170" y="20" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2. LA MAIN GUIDE : LA GRIFFE DE CHAT</text>
    
    <!-- Schéma Phalanges Bouclier -->
    <g transform="translate(40, 48)">
      <rect x="30" y="10" width="28" height="40" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
      <rect x="70" y="5" width="28" height="45" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
      <rect x="110" y="10" width="28" height="40" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
      <line x1="10" y1="28" x2="160" y2="28" stroke="#dc2626" stroke-width="2.5"/>
      <text x="170" y="32" font-family="Liberation Sans, Arial, sans-serif" font-size="9" font-weight="bold" fill="#dc2626">Lame en appui</text>
    </g>

    <text x="15" y="130" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#047857">• Doigts repliés vers la paume :</text>
    <text x="15" y="148" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#334155">Les ongles et le bout des doigts sont complètement rentrés à l'abri.</text>
    <text x="15" y="172" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#047857">• Le Bouclier de la 2e phalange :</text>
    <text x="15" y="190" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#334155">Le plat de la lame glisse contre la deuxième phalange verticale.</text>
    <text x="15" y="206" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#334155">Le fil tranchant coupe la matière 1 cm en contrebas.</text>
    <text x="15" y="232" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#047857">→ Impossible de se couper : la lame guide la main sans danger.</text>
  </g>
</svg>
