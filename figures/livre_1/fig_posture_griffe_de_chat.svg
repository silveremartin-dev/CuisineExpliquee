<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="100%">
  <rect width="800" height="370" rx="14" fill="#fcfbf7" stroke="#e8e2d5" stroke-width="2"/>

  <!-- Titre -->
  <text x="400" y="34" font-family="Liberation Serif, Georgia, serif" font-size="16" font-weight="bold" fill="#701c1a" text-anchor="middle">SÉCURITÉ DU COUTEAU : PRISE EN PINCE ET MAIN EN GRIFFE</text>
  <text x="400" y="54" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5c5549" text-anchor="middle">La biomécanique infaillible du chef pour trancher vite et sans danger.</text>

  <!-- Volet Gauche : Main Active (Prise en pince) -->
  <g transform="translate(40, 75)">
    <rect width="340" height="270" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="340" height="28" rx="8" fill="#701c1a"/>
    <text x="170" y="19" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1. LA MAIN ACTIVE : PRISE EN PINCE</text>

    <!-- Schéma Schématique du Couteau -->
    <g transform="translate(15, 38)">
      <path d="M 30 18 L 160 18 L 260 38 L 30 38 Z" fill="#f7f4eb" stroke="#5c5549" stroke-width="1.5"/>
      <rect x="10" y="13" width="35" height="30" rx="4" fill="#854d0e" stroke="#5c5549" stroke-width="1.2"/>
      <circle cx="75" cy="28" r="13" fill="#fcf8f2" stroke="#d4a373" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="75" y="32" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#701c1a" text-anchor="middle">Pince</text>
    </g>

    <text x="14" y="105" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#701c1a">✗ Ne pas tenir le couteau par le manche seul :</text>
    <text x="24" y="120" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Le manche crée un bras de levier instable</text>
    <text x="24" y="134" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">qui fait osciller et déraper la lame.</text>

    <text x="14" y="156" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5a6e54">✓ Le Geste Vertueux :</text>
    <text x="24" y="171" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124">Pincer fermement la base de l'acier entre</text>
    <text x="24" y="185" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124">le <tspan font-weight="bold">pouce</tspan> et l'<tspan font-weight="bold">index replié</tspan>.</text>
    <text x="24" y="199" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Les trois autres doigts enroulent le manche.</text>

    <rect x="14" y="215" width="312" height="38" rx="4" fill="#f4f6f4"/>
    <text x="170" y="230" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#5a6e54" text-anchor="middle">Contrôle direct de l'axe de coupe,</text>
    <text x="170" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#5c5549" text-anchor="middle">suppression des vibrations et fatigue minimale.</text>
  </g>

  <!-- Volet Droit : Main Passive (La griffe de chat) -->
  <g transform="translate(420, 75)">
    <rect width="340" height="270" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="340" height="28" rx="8" fill="#5a6e54"/>
    <text x="170" y="19" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2. LA MAIN GUIDE : LA GRIFFE DE CHAT</text>

    <!-- Schéma Phalanges Bouclier -->
    <g transform="translate(60, 42)">
      <rect x="25" y="10" width="24" height="35" rx="5" fill="#f7f4eb" stroke="#5c5549" stroke-width="1.2"/>
      <rect x="58" y="6" width="24" height="39" rx="5" fill="#f7f4eb" stroke="#5c5549" stroke-width="1.2"/>
      <rect x="91" y="10" width="24" height="35" rx="5" fill="#f7f4eb" stroke="#5c5549" stroke-width="1.2"/>
      <line x1="10" y1="26" x2="135" y2="26" stroke="#a3432b" stroke-width="2"/>
      <text x="145" y="30" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#a3432b">Lame en appui</text>
    </g>

    <text x="14" y="105" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#242124">• Doigts recourbés vers la paume :</text>
    <text x="24" y="120" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Ongles et pulpes complètement rétractés.</text>
    <text x="24" y="134" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Zéro risque d'entamer une extrémité.</text>

    <text x="14" y="156" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5a6e54">✓ Le Bouclier de la 2e phalange :</text>
    <text x="24" y="171" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124">Le plat de la lame glisse contre la paroi</text>
    <text x="24" y="185" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124">verticale formée par les phalanges repliées.</text>
    <text x="24" y="199" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Le fil coupe l'aliment 1 cm plus bas.</text>

    <rect x="14" y="215" width="312" height="38" rx="4" fill="#f4f6f4"/>
    <text x="170" y="230" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#5a6e54" text-anchor="middle">Coupe aveugle rapide et infaillible :</text>
    <text x="170" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#5c5549" text-anchor="middle">la lame est physiquement incapable de toucher la chair.</text>
  </g>
</svg>
