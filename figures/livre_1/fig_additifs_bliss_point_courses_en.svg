<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="100%" height="100%">
  <rect width="880" height="510" rx="14" fill="#FCFBF7" stroke="#DFDACF" stroke-width="2"/>
  <text x="440" y="34" font-family="Liberation Serif, Georgia, serif" font-size="20" font-weight="bold" fill="#701C1A" text-anchor="middle">FOOD INDUSTRY ENGINEERING: THE BLISS POINT &amp; E-ADDITIVES</text>
  <text x="440" y="55" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" fill="#5C5549" text-anchor="middle">Decoding ingredient lists, spotting toxic additives, and outsmarting the grocery trap.</text>

  <!-- Panneau Gauche : Le Triangle du Bliss Point -->
  <g transform="translate(30, 75)">
    <rect width="395" height="410" rx="10" fill="#FAF7F2" stroke="#A3432B" stroke-width="1.5"/>
    <rect width="395" height="32" rx="10" fill="#701C1A"/>
    <text x="197" y="21" font-family="Liberation Serif, Georgia, serif" font-size="13.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">1. THE BLISS POINT: SHORT-CIRCUITING SATIETY</text>

    <!-- Triangle équilatéral -->
    <polygon points="197,65 85,205 310,205" fill="#F7EFEA" stroke="#A3432B" stroke-width="2"/>

    <circle cx="197" cy="65" r="22" fill="#701C1A"/>
    <text x="197" y="69" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">SUGAR</text>

    <circle cx="85" cy="205" r="22" fill="#B45309"/>
    <text x="85" y="209" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">FAT</text>

    <circle cx="310" cy="205" r="22" fill="#6B4423"/>
    <text x="310" y="209" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">SALT</text>

    <text x="197" y="150" font-family="Liberation Serif, Georgia, serif" font-size="14" font-weight="bold" fill="#701C1A" text-anchor="middle">DOPAMINE SURGE</text>
    <text x="197" y="168" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#5C5549" text-anchor="middle">(Hypothalamic Leptin Inhibition)</text>

    <text x="16" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" fill="#242124"><tspan font-weight="bold" fill="#701C1A">• Addiction Ratio:</tspan> Food processors tune salt, sugar,</text>
    <text x="26" y="268" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#5C5549">and fat bypass natural satiety signals.</text>

    <text x="16" y="294" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" fill="#242124"><tspan font-weight="bold" fill="#701C1A">• Acoustic Illusion:</tspan> Synthesized crunchiness</text>
    <text x="26" y="312" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#5C5549">tricks the brain into perceiving fresh produce.</text>

    <text x="16" y="338" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" fill="#242124"><tspan font-weight="bold" fill="#701C1A">• Water Binding:</tspan> Added polyphosphates trap</text>
    <text x="26" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#5C5549">30% water, billed at premium meat price.</text>

    <rect x="16" y="370" width="363" height="28" rx="5" fill="#F2ECE1"/>
    <text x="197" y="388" font-family="Liberation Serif, Georgia, serif" font-size="12.2" font-weight="bold" fill="#701C1A" text-anchor="middle">Result: Passive, uncontrollable caloric overeating.</text>
  </g>

  <!-- Panneau Droit : Additifs E & Courses -->
  <g transform="translate(455, 75)">
    <rect width="395" height="410" rx="10" fill="#FAF7F2" stroke="#966C3B" stroke-width="1.5"/>
    <rect width="395" height="32" rx="10" fill="#6B4423"/>
    <text x="197" y="21" font-family="Liberation Serif, Georgia, serif" font-size="13.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">2. RATIONAL FILTERING &amp; SHOPPING CART RULES</text>

    <!-- Inoffensifs -->
    <rect x="16" y="46" width="363" height="96" rx="6" fill="#F4F6F4" stroke="#5A6E54" stroke-width="1.2"/>
    <text x="26" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5A6E54">✓ HARMLESS NATURAL COMPOUNDS:</text>
    <text x="26" y="85" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• <tspan font-weight="bold">E300</tspan>: Ascorbic acid (antioxidant Vitamin C).</text>
    <text x="26" y="103" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• <tspan font-weight="bold">E330</tspan>: Natural citric acid from lemon juice.</text>
    <text x="26" y="121" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• <tspan font-weight="bold">E322</tspan>: Lecithin (egg/soy) | <tspan font-weight="bold">E440</tspan>: Fruit pectin.</text>

    <!-- À bannir -->
    <rect x="16" y="154" width="363" height="122" rx="6" fill="#FBF6F5" stroke="#A3432B" stroke-width="1.2"/>
    <text x="26" y="174" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#701C1A">✗ HEALTH-COMPROMISING ADDITIVES TO AVOID:</text>
    <text x="26" y="193" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• <tspan font-weight="bold" fill="#701C1A">E250 (Sodium Nitrite):</tspan> Forms carcinogenic nitrosamines</text>
    <text x="36" y="209" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">nitrosamines in the stomach (cured meats).</text>
    <text x="26" y="227" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• <tspan font-weight="bold" fill="#701C1A">E150d :</tspan> Caramel au sulfite d'ammonium (sodas).</text>
    <text x="26" y="245" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• <tspan font-weight="bold" fill="#701C1A">E466 / E433 :</tspan> Émulsifiants synthétiques érodant</text>
    <text x="36" y="261" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">the protective mucosal barrier of the gut.</text>

    <!-- Courses -->
    <rect x="16" y="288" width="363" height="106" rx="6" fill="#F2ECE1" stroke="#B45309" stroke-width="1.2"/>
    <text x="26" y="308" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#B45309">THE SHOPPING NEUROBIOLOGY DEFENSE:</text>
    <text x="26" y="327" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• <tspan font-weight="bold">Empty Stomach:</tspan> Ghrelin surge bypasses</text>
    <text x="36" y="343" font-family="Liberation Sans, Arial, sans-serif" font-size="11.8" fill="#5C5549">the rational prefrontal cortex toward junk food.</text>
    <text x="26" y="365" font-family="Liberation Serif, Georgia, serif" font-size="12.2" font-weight="bold" fill="#5A6E54">✓ Golden rule: Shop on a full stomach, strict list,</text>
    <text x="36" y="381" font-family="Liberation Serif, Georgia, serif" font-size="12.0" font-weight="bold" fill="#5A6E54">and prioritize whole raw foods with no label!</text>
  </g>
</svg>