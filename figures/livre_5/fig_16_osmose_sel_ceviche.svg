<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <rect width="800" height="420" rx="12" fill="#fcfbf7" stroke="#dfdacf" stroke-width="1.5"/>
  <text x="400" y="36" font-family="Liberation Serif, Georgia, serif" font-size="17.5" font-weight="bold" fill="#701c1a" text-anchor="middle">LES TRANSFORMATIONS SANS FEU : OSMOSE SALINE ET DÉNATURATION ACIDE</text>
  <text x="400" y="58" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5c5549" text-anchor="middle">Comment le sel et le jus de citron réorganisent les protéines à froid sans apport de chaleur.</text>

  <!-- Volet Gauche : Osmose -->
  <g transform="translate(38, 82)">
    <rect width="348" height="310" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="348" height="30" rx="8" fill="#8c7355"/>
    <text x="174" y="20" font-family="Liberation Serif, Georgia, serif" font-size="11.5" font-weight="bold" fill="#fcfbf7" text-anchor="middle">L'OSMOSE DU SEL (SAUMURAGE À SEC)</text>

    <rect x="24" y="46" width="300" height="126" rx="6" fill="#fcfbf7" stroke="#d4a373" stroke-width="1.2"/>
    <line x1="174" y1="46" x2="174" y2="172" stroke="#8c7355" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="99" y="68" font-family="Liberation Serif, Georgia, serif" font-size="10" font-weight="bold" fill="#242124" text-anchor="middle">Intérieur Cellule</text>
    <text x="99" y="83" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549" text-anchor="middle">(Riche en eau libre)</text>
    <text x="249" y="68" font-family="Liberation Serif, Georgia, serif" font-size="10" font-weight="bold" fill="#701c1a" text-anchor="middle">Surface Salée</text>
    <text x="249" y="83" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549" text-anchor="middle">(Cristaux de sel NaCl)</text>

    <rect x="215" y="100" width="10" height="10" fill="#f2ece1" stroke="#701c1a" stroke-width="1.5"/>
    <rect x="242" y="120" width="10" height="10" fill="#f2ece1" stroke="#701c1a" stroke-width="1.5"/>
    <rect x="268" y="104" width="10" height="10" fill="#f2ece1" stroke="#701c1a" stroke-width="1.5"/>
    <rect x="230" y="144" width="10" height="10" fill="#f2ece1" stroke="#701c1a" stroke-width="1.5"/>

    <path d="M 110 115 L 158 115" stroke="#a3432b" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="164,115 156,111 156,119" fill="#a3432b"/>
    <path d="M 110 142 L 158 142" stroke="#a3432b" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="164,142 156,138 156,146" fill="#a3432b"/>
    <text x="134" y="132" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#a3432b" text-anchor="middle">Eau H₂O</text>

    <text x="174" y="196" font-family="Liberation Serif, Georgia, serif" font-size="10.8" font-weight="bold" fill="#242124" text-anchor="middle">Cinétique en 2 temps sur une viande :</text>
    <text x="18" y="218" font-family="Liberation Sans, Arial, sans-serif" font-size="9.6" fill="#242124">1. <tspan font-weight="bold" fill="#a3432b">0 à 15 min :</tspan> L'eau perle en surface pour</text>
    <text x="30" y="233" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#5c5549">dissoudre les cristaux de sel (ne pas saisir !).</text>
    <text x="18" y="253" font-family="Liberation Sans, Arial, sans-serif" font-size="9.6" fill="#242124">2. <tspan font-weight="bold" fill="#5a6e54">Dès 45 min :</tspan> La saumure détend les fibres</text>
    <text x="30" y="268" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#5c5549">et pénètre à cœur pour verrouiller le jus.</text>
    <text x="18" y="292" font-family="Liberation Serif, Georgia, serif" font-size="9.8" font-weight="bold" fill="#5a6e54">→ Gain : +15 % de jutosité après cuisson !</text>
  </g>

  <!-- Volet Droit : Ceviche -->
  <g transform="translate(414, 82)">
    <rect width="348" height="310" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="348" height="30" rx="8" fill="#5a6e54"/>
    <text x="174" y="20" font-family="Liberation Serif, Georgia, serif" font-size="11.5" font-weight="bold" fill="#fcfbf7" text-anchor="middle">LA CUISSON ACIDE (CEVICHE AU CITRON)</text>

    <rect x="24" y="46" width="300" height="126" rx="6" fill="#f4f6f4" stroke="#6e826b" stroke-width="1.2"/>
    <path d="M 48 112 C 48 82 88 82 88 112 C 88 132 58 132 68 102" fill="none" stroke="#5c5549" stroke-width="2.5"/>
    <text x="68" y="148" font-family="Liberation Serif, Georgia, serif" font-size="9.5" font-weight="bold" fill="#242124" text-anchor="middle">Pelote native</text>
    <text x="68" y="162" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549" text-anchor="middle">(Chair crue translucide)</text>

    <path d="M 122 112 L 166 112" stroke="#5a6e54" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="172,112 164,108 164,116" fill="#5a6e54"/>
    <text x="145" y="102" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5a6e54" text-anchor="middle">Citron (pH 2,3)</text>

    <path d="M 205 92 L 235 128 L 268 96 L 295 124" fill="none" stroke="#5a6e54" stroke-width="2.2"/>
    <path d="M 215 124 L 250 92 L 285 128" fill="none" stroke="#5a6e54" stroke-width="2.2"/>
    <text x="250" y="148" font-family="Liberation Serif, Georgia, serif" font-size="9.5" font-weight="bold" fill="#5a6e54" text-anchor="middle">Réseau coagulé</text>
    <text x="250" y="162" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549" text-anchor="middle">(Chair blanche nacrée)</text>

    <text x="174" y="196" font-family="Liberation Serif, Georgia, serif" font-size="10.8" font-weight="bold" fill="#242124" text-anchor="middle">Deux règles d'or du Ceviche :</text>
    <text x="18" y="218" font-family="Liberation Sans, Arial, sans-serif" font-size="9.6" fill="#242124">1. <tspan font-weight="bold" fill="#701c1a">Zéro destruction des parasites :</tspan> le citron</text>
    <text x="30" y="233" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#701c1a">ne tue pas le ver Anisakis (congélation requise).</text>
    <text x="18" y="253" font-family="Liberation Sans, Arial, sans-serif" font-size="9.6" fill="#242124">2. <tspan font-weight="bold" fill="#5a6e54">Temps court (5 à 15 min max) :</tspan> au-delà,</text>
    <text x="30" y="268" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#5c5549">l'acide presse le muscle et rend le poisson sec.</text>
    <text x="18" y="292" font-family="Liberation Serif, Georgia, serif" font-size="9.8" font-weight="bold" fill="#701c1a">→ Toujours minuter la marinade comme un feu !</text>
  </g>
</svg>
