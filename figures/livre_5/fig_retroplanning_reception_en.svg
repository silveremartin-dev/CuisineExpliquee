<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <rect width="960" height="360" rx="12" fill="#FCFBF7" stroke="#DFDACF" stroke-width="2"/>
  <text x="480" y="36" font-family="Liberation Serif, Georgia, serif" font-size="20" font-weight="bold" fill="#701C1A" text-anchor="middle">HOSTING MASTER TIMELINE: SCHEDULE OF THE STRESS-FREE COOK</text>
  <text x="480" y="58" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#5C5549" text-anchor="middle">Decoupling prep-time physics from table-side hospitality.</text>

  <!-- Step 1: D-2 / D-1 -->
  <g transform="translate(30, 85)">
    <rect width="205" height="235" rx="8" fill="#FAF7F2" stroke="#966C3B" stroke-width="1.5"/>
    <rect width="205" height="36" rx="8" fill="#701C1A"/>
    <text x="102" y="23" font-family="Liberation Serif, Georgia, serif" font-size="13" font-weight="bold" fill="#FCFBF7" text-anchor="middle">D - 2 / D - 1: ANTICIPATE</text>
    <text x="15" y="65" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#701C1A">• Complete Groceries</text>
    <text x="25" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Check spices and seasoning</text>
    <text x="15" y="108" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#701C1A">• Doughs &amp; Desserts</text>
    <text x="25" y="125" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Tart shells, bases, infusions</text>
    <text x="15" y="151" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#701C1A">• Stocks &amp; Glazes</text>
    <text x="25" y="168" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Collagen reductions &amp; fond</text>
    <text x="15" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#701C1A">• Marinades &amp; Braises</text>
    <text x="25" y="211" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Taste better reheated on D-Day</text>
  </g>

  <path d="M 238 200 L 265 200" stroke="#A3432B" stroke-width="2.5"/>
  <polygon points="269,200 261,196 261,204" fill="#A3432B"/>

  <!-- Step 2: D-Day Morning -->
  <g transform="translate(270, 85)">
    <rect width="205" height="235" rx="8" fill="#FAF7F2" stroke="#966C3B" stroke-width="1.5"/>
    <rect width="205" height="36" rx="8" fill="#A3432B"/>
    <text x="102" y="23" font-family="Liberation Serif, Georgia, serif" font-size="13" font-weight="bold" fill="#FCFBF7" text-anchor="middle">D-DAY MORNING: ORGANIZE</text>
    <text x="15" y="65" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#A3432B">• Vegetable Knife Cuts</text>
    <text x="25" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Peel, mince, trim produce</text>
    <text x="15" y="108" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#A3432B">• Precise Mise en Place</text>
    <text x="25" y="125" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">All weighed in prep bowls</text>
    <text x="15" y="151" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#A3432B">• Set Dining Table</text>
    <text x="25" y="168" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Stemware, flatware, linens</text>
    <text x="15" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#A3432B">• Pristine Kitchen</text>
    <text x="25" y="211" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Empty sink, dishes cleared</text>
  </g>

  <path d="M 478 200 L 505 200" stroke="#B45309" stroke-width="2.5"/>
  <polygon points="509,200 501,196 501,204" fill="#B45309"/>

  <!-- Step 3: H - 2 Hours -->
  <g transform="translate(510, 85)">
    <rect width="205" height="235" rx="8" fill="#FAF7F2" stroke="#966C3B" stroke-width="1.5"/>
    <rect width="205" height="36" rx="8" fill="#B45309"/>
    <text x="102" y="23" font-family="Liberation Serif, Georgia, serif" font-size="13" font-weight="bold" fill="#FCFBF7" text-anchor="middle">H - 2 HOURS: CONDITION</text>
    <text x="15" y="65" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#B45309">• Temper Meats</text>
    <text x="25" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Bring to 20°C (68°F) room temp</text>
    <text x="15" y="108" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#B45309">• Preheat Dinner Plates</text>
    <text x="25" y="125" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Warm oven at 55°C (130°F)</text>
    <text x="15" y="151" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#B45309">• Open &amp; Decant Red Wines</text>
    <text x="25" y="168" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Aroma oxygenation</text>
    <text x="15" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#B45309">• Host's Reset Break</text>
    <text x="25" y="211" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Shower, relax, serene mind</text>
  </g>

  <path d="M 718 200 L 745 200" stroke="#5A6E54" stroke-width="2.5"/>
  <polygon points="749,200 741,196 741,204" fill="#5A6E54"/>

  <!-- Step 4: Arrival -->
  <g transform="translate(750, 85)">
    <rect width="185" height="235" rx="8" fill="#F4F6F4" stroke="#5A6E54" stroke-width="2"/>
    <rect width="185" height="36" rx="8" fill="#5A6E54"/>
    <text x="92" y="23" font-family="Liberation Serif, Georgia, serif" font-size="13" font-weight="bold" fill="#FCFBF7" text-anchor="middle">GUESTS ARRIVE: SAVOR</text>
    <text x="12" y="65" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#5A6E54">✓ Host Fully Present</text>
    <text x="22" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Warm relaxed guest greeting</text>
    <text x="12" y="108" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#5A6E54">✓ Zero Rush or Panic</text>
    <text x="22" y="125" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Everything ready in advance</text>
    <text x="12" y="151" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#5A6E54">✓ Flash Pan Searing</text>
    <text x="22" y="168" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Quick sear in hot cast iron</text>
    <text x="12" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#5A6E54">✓ Shared Enjoyment</text>
    <text x="22" y="211" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5C5549">Seated relaxed at the table</text>
  </g>
</svg>
