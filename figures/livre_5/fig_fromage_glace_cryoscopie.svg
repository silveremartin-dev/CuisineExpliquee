<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="100%" height="100%">
  <rect width="840" height="470" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="420" y="36" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">DEUX RECETTES FONDATRICES PAR LES PRINCIPES PREMIERS</text>
  <text x="420" y="58" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Fabriquer du fromage frais et de la glace onctueuse avec zéro machine sophistiquée.</text>

  <!-- Volet Gauche : Le Fromage Frais Maison (Précipitation Acide) -->
  <g transform="translate(30, 80)">
    <rect width="375" height="365" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="375" height="32" rx="12" fill="#16a34a"/>
    <text x="187" y="21" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">LE FROMAGE FRAIS EN 15 MINUTES (SANS PRÉSURE)</text>

    <!-- Schéma Caséines qui s'agrègent -->
    <rect x="20" y="45" width="335" height="85" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <circle cx="65" cy="85" r="22" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="65" y="89" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle">Caséines</text>
    
    <path d="M 98 85 L 140 85" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="145,85 137,81 137,89" fill="#16a34a"/>
    <text x="120" y="77" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#15803d" font-weight="bold" text-anchor="middle">+ H⁺ (Citron)</text>

    <path d="M 165 70 L 185 95 L 205 70 L 225 95 L 245 70" fill="none" stroke="#15803d" stroke-width="2.5"/>
    <text x="280" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#14532d">Caillé dense</text>
    <text x="280" y="96" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#15803d">+ Petit-lait</text>

    <text x="20" y="150" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Ingrédients élémentaires :</text>
    <text x="20" y="168" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#334155">1 litre de lait entier (cru ou frais pasteurisé)</text>
    <text x="20" y="183" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#334155">+ 3 cuillères à soupe de jus de citron frais ou vinaigre blanc.</text>

    <text x="20" y="208" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">Protocole physique :</text>
    <text x="20" y="226" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#14532d">1. Chauffer le lait à <tspan font-weight="bold">82°C</tspan> (vapeur dense sans gros bouillons).</text>
    <text x="20" y="243" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#14532d">2. Couper le feu, verser le jus acide, remuer une seule fois.</text>
    <text x="20" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#14532d">3. Reposer 10 min : le caillé floconne dans un sérum opalescent.</text>
    <text x="20" y="277" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#14532d">4. Égoutter dans une passoire garnie d'une étamine propre.</text>
    <rect x="20" y="296" width="335" height="52" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="30" y="315" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#15803d" font-weight="bold">• Faisselle onctueuse : 20 min d'égouttage libre.</text>
    <text x="30" y="333" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#15803d" font-weight="bold">• Paneer ferme : presser 1h sous un poids (découpe en dés).</text>
  </g>

  <!-- Volet Droit : La Glace Cryoscopique Sel / Glaçons -->
  <g transform="translate(435, 80)">
    <rect width="375" height="365" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="375" height="32" rx="12" fill="#0284c7"/>
    <text x="187" y="21" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">LA GLACE SANS MACHINE PAR LE SEL (-18°C)</text>

    <!-- Schéma Bain de Sel Cryoscopique -->
    <rect x="20" y="45" width="335" height="85" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
    <circle cx="187" cy="88" r="32" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="187" y="85" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#0369a1" text-anchor="middle">Grand bol :</text>
    <text x="187" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#0284c7" font-weight="bold" text-anchor="middle">Glace + Sel (-18°C)</text>
    
    <circle cx="187" cy="88" r="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="187" y="91" font-family="Liberation Sans, Arial, sans-serif" font-size="7.5" fill="#92400e" text-anchor="middle">Crème</text>

    <text x="20" y="150" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Principe de l'Abaissement Cryoscopique :</text>
    <text x="20" y="168" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#334155">La dissolution endothermique du sel dans la glace brise le réseau</text>
    <text x="20" y="183" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#334155">cristallin et fait chuter le bain liquide à <tspan font-weight="bold" fill="#0284c7">-18°C</tspan> instantanément !</text>

    <text x="20" y="208" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">Protocole sans sorbetière :</text>
    <text x="20" y="226" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#0369a1">1. Grand cul-de-poule : 1 kg glaçons pilés + 250 g gros sel.</text>
    <text x="20" y="243" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#0369a1">2. Poser au centre un cul-de-poule inox contenant l'appareil.</text>
    <text x="20" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#0369a1">3. Fouetter activement au fouet manuel pendant 8 à 10 min.</text>
    <text x="20" y="277" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#0369a1">4. Le raclage des parois empêche les cristaux de grossir.</text>
    <rect x="20" y="296" width="335" height="52" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
    <text x="30" y="315" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#0284c7" font-weight="bold">Résultat : Une crème glacée veloutée à micro-cristaux,</text>
    <text x="30" y="333" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#0284c7" font-weight="bold">d'une onctuosité égale aux meilleures turbines italiennes.</text>
  </g>
</svg>
