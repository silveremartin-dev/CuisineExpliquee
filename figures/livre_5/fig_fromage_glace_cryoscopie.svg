<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400" y="36" font-family="Liberation Sans, Arial, sans-serif" font-size="22.8" font-weight="bold" fill="#0f172a" text-anchor="middle">DEUX RECETTES FONDATRICES PAR LES PRINCIPES PREMIERS</text>
  <text x="400" y="58" font-family="Liberation Sans, Arial, sans-serif" font-size="16.2" fill="#64748b" text-anchor="middle">Fabriquer du fromage frais et de la glace onctueuse avec zéro machine sophistiquée.</text>

  <!-- Volet Gauche : Le Fromage Frais Maison (Précipitation Acide) -->
  <g transform="translate(40, 80)">
    <rect width="345" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="30" rx="12" fill="#16a34a"/>
    <text x="172" y="20" font-family="Liberation Sans, Arial, sans-serif" font-size="15.6" font-weight="bold" fill="#ffffff" text-anchor="middle">LE FROMAGE FRAIS EN 15 MINUTES (SANS PRÉSURE)</text>

    <!-- Schéma Caséines qui s'agrègent -->
    <rect x="25" y="45" width="295" height="85" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <circle cx="70" cy="85" r="22" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="70" y="89" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#1e40af" text-anchor="middle">Caséines</text>
    
    <path d="M 105 85 L 140 85" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="145,85 137,81 137,89" fill="#16a34a"/>
    <text x="122" y="77" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#15803d" font-weight="bold" text-anchor="middle">+ H⁺ (Citron)</text>

    <path d="M 160 70 L 180 95 L 200 70 L 220 95 L 240 70" fill="none" stroke="#15803d" stroke-width="2.5"/>
    <text x="265" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" font-weight="bold" fill="#14532d">Caillé dense</text>
    <text x="265" y="96" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#15803d">+ Petit-lait</text>

    <text x="20" y="150" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" font-weight="bold" fill="#0f172a">Ingrédients :</text>
    <text x="20" y="168" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#334155">1 litre de lait entier (cru ou frais pasteurisé) + 3 c.à.s de citron ou vinaigre.</text>

    <text x="20" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" font-weight="bold" fill="#166534">Protocole physique :</text>
    <text x="20" y="212" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#14532d">1. Chauffer le lait à <tspan font-weight="bold">82°C</tspan> (vapeur dense sans gros bouillons).</text>
    <text x="20" y="228" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#14532d">2. Couper le feu, verser le jus de citron, remuer une fois.</text>
    <text x="20" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#14532d">3. Laisser reposer 10 min : le caillé blanc floconne dans un liquide jaune.</text>
    <text x="20" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#14532d">4. Verser dans une passoire garnie d'un torchon propre (étamine).</text>
    <text x="20" y="278" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#15803d" font-weight="bold">Résultat : Faisselle soyeuse (20 min d'égouttage) ou Paneer ferme (pressé 1h).</text>
  </g>

  <!-- Volet Droit : La Glace Cryoscopique Sel / Glaçons -->
  <g transform="translate(415, 80)">
    <rect width="345" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="30" rx="12" fill="#0284c7"/>
    <text x="172" y="20" font-family="Liberation Sans, Arial, sans-serif" font-size="15.6" font-weight="bold" fill="#ffffff" text-anchor="middle">LA GLACE SANS MACHINE PAR LE SEL (-18°C)</text>

    <!-- Schéma Bain de Sel Cryoscopique -->
    <rect x="25" y="45" width="295" height="85" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
    <circle cx="172" cy="88" r="32" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="172" y="85" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#0369a1" text-anchor="middle">Grand bol :</text>
    <text x="172" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#0284c7" font-weight="bold" text-anchor="middle">Glace + Sel (-18°C)</text>
    
    <circle cx="172" cy="88" r="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="172" y="91" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" fill="#92400e" text-anchor="middle">Crème</text>

    <text x="20" y="150" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" font-weight="bold" fill="#0f172a">Principe de l'Abaissement Cryoscopique :</text>
    <text x="20" y="168" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#334155">La dissolution du sel marin dans la glace brise les liaisons cristallines,</text>
    <text x="20" y="182" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#334155">pompant la chaleur ambiante et faisant chuter le bain liquide à <tspan font-weight="bold">-18°C</tspan> !</text>

    <text x="20" y="205" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" font-weight="bold" fill="#0284c7">Protocole sans sorbetière :</text>
    <text x="20" y="222" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#0369a1">1. Dans un grand cul-de-poule : 1 kg de glaçons pilés + 250 g de gros sel.</text>
    <text x="20" y="238" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#0369a1">2. Poser un petit cul-de-poule inox au centre contenant la crème anglaise.</text>
    <text x="20" y="254" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#0369a1">3. Fouetter énergiquement à la main pendant 8 à 10 minutes.</text>
    <text x="20" y="270" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#0369a1">4. Le raclage permanent empêche les gros cristaux de se souder.</text>
    <text x="20" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#0284c7" font-weight="bold">Résultat : Une glace minute au velouté digne d'une turbine professionnelle.</text>
  </g>
</svg>