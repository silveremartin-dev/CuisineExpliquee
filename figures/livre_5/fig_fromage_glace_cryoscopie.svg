<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="100%" height="100%">
  <rect width="820" height="450" rx="12" fill="#fcfbf7" stroke="#dfdacf" stroke-width="1.5"/>
  <text x="410" y="35" font-family="Liberation Serif, Georgia, serif" font-size="18" font-weight="bold" fill="#701c1a" text-anchor="middle">DEUX RECETTES FONDATRICES PAR LES PRINCIPES PREMIERS</text>
  <text x="410" y="56" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5c5549" text-anchor="middle">Fabriquer du fromage frais et de la crème glacée onctueuse sans aucune machine.</text>

  <!-- Volet Gauche : Le Fromage Frais Maison -->
  <g transform="translate(32, 76)">
    <rect width="366" height="350" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="366" height="30" rx="8" fill="#5a6e54"/>
    <text x="183" y="20" font-family="Liberation Serif, Georgia, serif" font-size="11.2" font-weight="bold" fill="#fcfbf7" text-anchor="middle">LE FROMAGE FRAIS EN 15 MIN (SANS PRÉSURE)</text>

    <rect x="18" y="42" width="330" height="80" rx="6" fill="#f4f6f4" stroke="#6e826b" stroke-width="1"/>
    <circle cx="62" cy="82" r="22" fill="#fcfbf7" stroke="#8c7355" stroke-width="1.8"/>
    <text x="62" y="86" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#242124" text-anchor="middle">Caséines</text>
    
    <path d="M 94 82 L 136 82" stroke="#5a6e54" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="142,82 134,78 134,86" fill="#5a6e54"/>
    <text x="116" y="73" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5a6e54" font-weight="bold" text-anchor="middle">+ Citron</text>

    <path d="M 160 68 L 178 92 L 196 68 L 214 92 L 232 68" fill="none" stroke="#5a6e54" stroke-width="2.2"/>
    <text x="285" y="79" font-family="Liberation Serif, Georgia, serif" font-size="9.5" font-weight="bold" fill="#5a6e54" text-anchor="middle">Caillé doux</text>
    <text x="285" y="93" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549" text-anchor="middle">+ Petit-lait</text>

    <text x="18" y="144" font-family="Liberation Serif, Georgia, serif" font-size="10.5" font-weight="bold" fill="#242124">Ingrédients élémentaires :</text>
    <text x="18" y="162" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#383330">• 1 L de lait entier + 3 c. à soupe de jus de citron.</text>

    <text x="18" y="188" font-family="Liberation Serif, Georgia, serif" font-size="10.5" font-weight="bold" fill="#5a6e54">Protocole pas à pas :</text>
    <text x="18" y="206" font-family="Liberation Sans, Arial, sans-serif" font-size="9.3" fill="#242124">1. Chauffer le lait à <tspan font-weight="bold" fill="#701c1a">82°C</tspan> (vapeur dense sans bouillir).</text>
    <text x="18" y="223" font-family="Liberation Sans, Arial, sans-serif" font-size="9.3" fill="#242124">2. Couper le feu, verser le citron, remuer doucement.</text>
    <text x="18" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="9.3" fill="#242124">3. Laisser floculer 10 min à couvert (pH 4,6 atteint).</text>
    <text x="18" y="257" font-family="Liberation Sans, Arial, sans-serif" font-size="9.3" fill="#242124">4. Égoutter dans un linge propre posé sur une passoire.</text>

    <rect x="18" y="276" width="330" height="54" rx="6" fill="#f4f6f4" stroke="#6e826b" stroke-width="1"/>
    <text x="28" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5a6e54" font-weight="bold">• Ricotta crémeuse : 15 min d'égouttage libre.</text>
    <text x="28" y="314" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5a6e54" font-weight="bold">• Paneer à griller : presser 1 h sous une casserole.</text>
  </g>

  <!-- Volet Droit : La Glace Cryoscopique -->
  <g transform="translate(422, 76)">
    <rect width="366" height="350" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="366" height="30" rx="8" fill="#701c1a"/>
    <text x="183" y="20" font-family="Liberation Serif, Georgia, serif" font-size="11.2" font-weight="bold" fill="#fcfbf7" text-anchor="middle">LA GLACE EXPRESS PAR LE SEL (-18°C)</text>

    <rect x="18" y="42" width="330" height="80" rx="6" fill="#faf6ee" stroke="#d4a373" stroke-width="1"/>
    <circle cx="183" cy="82" r="32" fill="#f2ece1" stroke="#8c7355" stroke-width="1.8"/>
    <text x="90" y="78" font-family="Liberation Serif, Georgia, serif" font-size="9.2" font-weight="bold" fill="#701c1a" text-anchor="middle">Grand saladier :</text>
    <text x="90" y="92" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549" text-anchor="middle">Glace + Gros sel</text>
    
    <circle cx="183" cy="82" r="17" fill="#faf7f0" stroke="#92400e" stroke-width="1.5"/>
    <text x="183" y="85" font-family="Liberation Sans, Arial, sans-serif" font-size="7.8" font-weight="bold" fill="#92400e" text-anchor="middle">Crème</text>
    <text x="275" y="78" font-family="Liberation Serif, Georgia, serif" font-size="9.2" font-weight="bold" fill="#701c1a" text-anchor="middle">Choc à -18°C</text>
    <text x="275" y="92" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549" text-anchor="middle">Prise en 8 min</text>

    <text x="18" y="144" font-family="Liberation Serif, Georgia, serif" font-size="10.5" font-weight="bold" fill="#242124">Principe de l'Abaissement Cryoscopique :</text>
    <text x="18" y="162" font-family="Liberation Sans, Arial, sans-serif" font-size="9.3" fill="#383330">Fondre pour dissoudre le sel absorbe la chaleur ambiante :</text>
    <text x="18" y="176" font-family="Liberation Sans, Arial, sans-serif" font-size="9.3" fill="#383330">la saumure glacée plonge spontanément à <tspan font-weight="bold" fill="#701c1a">-18°C</tspan> !</text>

    <text x="18" y="198" font-family="Liberation Serif, Georgia, serif" font-size="10.5" font-weight="bold" fill="#701c1a">Protocole sans sorbetière :</text>
    <text x="18" y="215" font-family="Liberation Sans, Arial, sans-serif" font-size="9.3" fill="#242124">1. Grand bol : 1 kg de glaçons + 300 g de gros sel.</text>
    <text x="18" y="231" font-family="Liberation Sans, Arial, sans-serif" font-size="9.3" fill="#242124">2. Y niché un bol inox contenant la crème anglaise.</text>
    <text x="18" y="247" font-family="Liberation Sans, Arial, sans-serif" font-size="9.3" fill="#242124">3. Fouetter vivement pendant 8 à 10 minutes.</text>

    <rect x="18" y="276" width="330" height="54" rx="6" fill="#faf6ee" stroke="#d4a373" stroke-width="1"/>
    <text x="28" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#92400e" font-weight="bold">✓ Le fouet brise les cristaux de glace naissants</text>
    <text x="28" y="314" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#92400e" font-weight="bold">et incorpore l'air : texture soyeuse de grand glacier.</text>
  </g>
</svg>
