<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <rect width="800" height="380" rx="12" fill="#fcfbf7" stroke="#dfdacf" stroke-width="1.5"/>
  <text x="400" y="36" font-family="Liberation Serif, Georgia, serif" font-size="18" font-weight="bold" fill="#701c1a" text-anchor="middle">LA MÉCANIQUE DE L'ÉMULSION : LA CLÉ À DEUX TÊTES (LÉCITHINE)</text>
  <text x="400" y="58" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5c5549" text-anchor="middle">Comment le jaune d'œuf et la moutarde réconcilient l'eau et l'huile en une crème ferme.</text>

  <g transform="translate(45, 85)">
    <rect width="340" height="265" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect width="340" height="30" rx="8" fill="#8c7355"/>
    <text x="170" y="20" font-family="Liberation Serif, Georgia, serif" font-size="11.5" font-weight="bold" fill="#fcfbf7" text-anchor="middle">1. LA GOUTTELETTE STABILISÉE (MICELLE)</text>
    <circle cx="170" cy="130" r="45" fill="#f5e6c8" stroke="#92400e" stroke-width="2.5"/>
    <text x="170" y="134" font-family="Liberation Serif, Georgia, serif" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">Bille d'Huile</text>
    <circle cx="170" cy="70" r="6" fill="#701c1a"/>
    <line x1="170" y1="76" x2="170" y2="92" stroke="#701c1a" stroke-width="2"/>
    <circle cx="170" cy="190" r="6" fill="#701c1a"/>
    <line x1="170" y1="184" x2="170" y2="168" stroke="#701c1a" stroke-width="2"/>
    <circle cx="110" cy="130" r="6" fill="#701c1a"/>
    <line x1="116" y1="130" x2="132" y2="130" stroke="#701c1a" stroke-width="2"/>
    <circle cx="230" cy="130" r="6" fill="#701c1a"/>
    <line x1="224" y1="130" x2="208" y2="130" stroke="#701c1a" stroke-width="2"/>
    <text x="170" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124" text-anchor="middle">• <tspan font-weight="bold" fill="#701c1a">Tête externe :</tspan> aime l'eau (vinaigre/citron)</text>
    <text x="170" y="238" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124" text-anchor="middle">• <tspan font-weight="bold" fill="#92400e">Queue interne :</tspan> plonge dans la goutte d'huile</text>
  </g>

  <g transform="translate(415, 85)">
    <rect width="340" height="265" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect width="340" height="30" rx="8" fill="#701c1a"/>
    <text x="170" y="20" font-family="Liberation Serif, Georgia, serif" font-size="11.5" font-weight="bold" fill="#fcfbf7" text-anchor="middle">2. LA LOI DE FERMETÉ CONTRE-INTUITIVE</text>
    <text x="20" y="58" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#242124">• Plus on verse d'<tspan font-weight="bold" fill="#92400e">huile liquide</tspan> en fouettant,</text>
    <text x="30" y="74" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#242124">plus la mayonnaise devient <tspan font-weight="bold" fill="#701c1a">ferme et compacte</tspan> !</text>
    <text x="20" y="102" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#5c5549">Pourquoi ? Les milliards de micro-billes d'huile</text>
    <text x="20" y="118" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#5c5549">s'entassent les unes contre les autres et ne</text>
    <text x="20" y="134" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#5c5549">peuvent plus glisser : c'est l'embouteillage</text>
    <text x="20" y="150" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#5c5549">microscopique qui fige la sauce.</text>
    <rect x="20" y="175" width="300" height="72" rx="6" fill="#f4f6f4" stroke="#6e826b" stroke-width="1"/>
    <text x="170" y="196" font-family="Liberation Serif, Georgia, serif" font-size="10" font-weight="bold" fill="#5a6e54" text-anchor="middle">Sauvetage express (30 s) :</text>
    <text x="170" y="214" font-family="Liberation Sans, Arial, sans-serif" font-size="9.2" fill="#242124" text-anchor="middle">Si la sauce tranche (trop d'huile d'un coup),</text>
    <text x="170" y="230" font-family="Liberation Sans, Arial, sans-serif" font-size="9.2" fill="#5a6e54" text-anchor="middle" font-weight="bold">repartir d'une cuillère d'eau tiède au fond d'un bol.</text>
  </g>
</svg>
