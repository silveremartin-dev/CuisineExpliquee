<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400" y="38" font-family="Liberation Sans, Arial, sans-serif" font-size="23.0" font-weight="bold" fill="#0f172a" text-anchor="middle">ANATOMIE PHYSICO-CHIMIQUE ET BARRIÈRE CUTICULAIRE DE L'ŒUF</text>
  <text x="400" y="62" font-family="Liberation Sans, Arial, sans-serif" font-size="16.9" fill="#64748b" text-anchor="middle">Pourquoi l'œuf est un écosystème respirant et pourquoi le lavage détruit sa défense biologique.</text>
  <g transform="translate(60, 95)">
    <path d="M 140 20 C 230 20 280 120 280 200 C 280 280 220 320 140 320 C 60 320 0 280 0 200 C 0 120 50 20 140 20 Z" fill="#fffbeb" stroke="#d97706" stroke-width="4"/>
    <path d="M 140 14 C 236 14 286 118 286 200 C 286 286 224 326 140 326 C 56 326 -6 286 -6 200 C -6 118 44 14 140 14 Z" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
    <path d="M 50 295 Q 140 260 230 295 C 205 315 165 320 140 320 C 115 320 75 315 50 295 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="140" y="303" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" font-weight="bold" fill="#0369a1" text-anchor="middle">Chambre à air</text>
    <path d="M 140 35 C 215 35 260 125 260 195 C 260 255 205 265 140 265 C 75 265 20 255 20 195 C 20 125 65 35 140 35 Z" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <path d="M 140 60 C 195 60 235 130 235 190 C 235 240 195 245 140 245 C 85 245 45 240 45 190 C 45 130 85 60 140 60 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
    <circle cx="140" cy="165" r="52" fill="#fbbf24" stroke="#d97706" stroke-width="2.5"/>
    <circle cx="140" cy="165" r="46" fill="#f59e0b"/>
    <circle cx="120" cy="145" r="5" fill="#fef3c7"/>
    <path d="M 88 165 C 70 160 65 170 48 165" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M 192 165 C 210 160 215 170 232 165" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
  <g transform="translate(390, 95)">
    <rect width="370" height="135" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="15" y="24" font-family="Liberation Sans, Arial, sans-serif" font-size="16.9" font-weight="bold" fill="#166534">LE DILEMME DU FRIGO : EUROPE vs ÉTATS-UNIS</text>
    <text x="15" y="46" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" fill="#14532d">• <tspan font-weight="bold">La cuticule protectrice :</tspan> fine pellicule protéique naturelle</text>
    <text x="25" y="62" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#15803d">qui colmate les 10 000 pores de calcite contre les microbes.</text>
    <text x="15" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" fill="#14532d">• <tspan font-weight="bold">Europe (Pas de lavage obligatoire) :</tspan> cuticule intacte.</text>
    <text x="25" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#15803d">Stockage tempéré possible (évite condensation favorisant bactéries).</text>
    <text x="15" y="118" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" fill="#991b1b">• <tspan font-weight="bold">USA (Lavage désinfectant) :</tspan> cuticule détruite $	o$ frigo vital (4°C).</text>
    <rect y="150" width="370" height="170" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="15" y="174" font-family="Liberation Sans, Arial, sans-serif" font-size="16.9" font-weight="bold" fill="#1e40af">LA MÉCANIQUE DU TEMPS : 3 TRANSFORMATIONS</text>
    <text x="15" y="196" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" fill="#1e3a8a"><tspan font-weight="bold">1. Évaporation hydrique :</tspan> la chambre à air grossit.</text>
    <text x="25" y="211" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#3b82f6">Œuf frais coule horizontalement ; œuf vieux flotte verticalement.</text>
    <text x="15" y="233" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" fill="#1e3a8a"><tspan font-weight="bold">2. Fuite de CO₂ dissous :</tspan> le pH monte de 7.6 à 9.2.</text>
    <text x="25" y="248" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#3b82f6">L'albumen s'alcalinise spontanément et perd sa turbidité laiteuse.</text>
    <text x="15" y="270" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" fill="#1e3a8a"><tspan font-weight="bold">3. Liquéfaction de l'albumen :</tspan> dégradation de l'ovomucine.</text>
    <text x="25" y="285" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#3b82f6">L'œuf frais reste compact en dôme ; l'œuf âgé s'étale comme de l'eau.</text>
    <text x="25" y="305" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#b91c1c" font-weight="bold">Conséquence : seul l'œuf extra-frais permet un œuf poché parfait.</text>
  </g>
</svg>