<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" rx="14" fill="#fcfbf7" stroke="#dfdacf" stroke-width="2"/>
  
  <text x="400" y="34" font-family="Liberation Serif, Georgia, serif" font-size="17" font-weight="bold" fill="#701c1a" text-anchor="middle">PHYSIOLOGIE DE LA NUTRITION ET CYCLE DE SURVIE</text>
  <text x="400" y="54" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5c5549" text-anchor="middle">Du signal sensoriel à l'assimilation : comment l'organisme discerne le nutriment du toxique.</text>

  <!-- Colonne 1 : Signaux sensoriels -->
  <g transform="translate(40, 75)">
    <rect width="220" height="175" rx="8" fill="#faf7f2" stroke="#d4a373" stroke-width="1.2"/>
    <rect x="0" y="0" width="220" height="28" rx="8" fill="#8c7355"/>
    <text x="110" y="19" font-family="Liberation Serif, Georgia, serif" font-size="11" font-weight="bold" fill="#fcfbf7" text-anchor="middle">1. SIGNAUX SENSORIELS</text>
    
    <text x="14" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124"><tspan font-weight="bold" fill="#a3432b">• Sucré :</tspan> signal calorique vital</text>
    <text x="14" y="68" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124"><tspan font-weight="bold" fill="#5c5549">• Salé :</tspan> équilibre osmotique (Na⁺)</text>
    <text x="14" y="88" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124"><tspan font-weight="bold" fill="#701c1a">• Amer :</tspan> alerte alcaloïde / poison</text>
    <text x="14" y="108" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124"><tspan font-weight="bold" fill="#5a6e54">• Acide :</tspan> ferment utile ou altération</text>
    <text x="14" y="128" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124"><tspan font-weight="bold" fill="#92400e">• Umami :</tspan> protéines &amp; acides aminés</text>
    <text x="14" y="152" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#5c5549" font-style="italic">Boussole biologique de survie.</text>
  </g>

  <!-- Colonne 2 : Besoins selon l'âge -->
  <g transform="translate(290, 75)">
    <rect width="220" height="175" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="220" height="28" rx="8" fill="#5c5549"/>
    <text x="110" y="19" font-family="Liberation Serif, Georgia, serif" font-size="11" font-weight="bold" fill="#fcfbf7" text-anchor="middle">2. BESOINS DU CORPS</text>
    
    <text x="14" y="47" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#242124">• Croissance (0–20 ans) :</text>
    <text x="24" y="61" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Lipides (myéline), calcium,</text>
    <text x="24" y="74" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">acides aminés indispensables.</text>
    
    <text x="14" y="93" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#242124">• Adulte actif :</text>
    <text x="24" y="107" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Glucides complexes, oméga-3/6,</text>
    <text x="24" y="120" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">équilibre acido-basique.</text>
    
    <text x="14" y="139" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#242124">• Eau biologique :</text>
    <text x="24" y="153" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">2 L/jour (eau libre + végétaux).</text>
    <text x="24" y="166" font-family="Liberation Sans, Arial, sans-serif" font-size="8.2" fill="#701c1a">Tampon des bicarbonates.</text>
  </g>

  <!-- Colonne 3 : Digestion et Épuration -->
  <g transform="translate(540, 75)">
    <rect width="220" height="175" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="220" height="28" rx="8" fill="#5a6e54"/>
    <text x="110" y="19" font-family="Liberation Serif, Georgia, serif" font-size="11" font-weight="bold" fill="#fcfbf7" text-anchor="middle">3. DIGESTION &amp; ÉPURATION</text>
    
    <text x="14" y="47" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#242124">• Estomac (pH 1,5) :</text>
    <text x="24" y="61" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Dénaturation acide et désinfection.</text>
    
    <text x="14" y="80" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#242124">• Intestin grêle :</text>
    <text x="24" y="94" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Hydrolyse enzymatique et passage.</text>
    
    <text x="14" y="113" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#242124">• Côlon &amp; Filtres :</text>
    <text x="24" y="127" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Fibres de lest, microbiote actif.</text>
    <text x="24" y="140" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Évacuation des acides biliaires.</text>
    <text x="24" y="160" font-family="Liberation Sans, Arial, sans-serif" font-size="8.2" fill="#701c1a">Épuration : urée et résidus.</text>
  </g>

  <!-- Grand bandeau inférieur : Maturation vs Putréfaction -->
  <g transform="translate(40, 265)">
    <rect width="720" height="195" rx="10" fill="#faf7f2" stroke="#d4a373" stroke-width="1.5"/>
    <text x="360" y="24" font-family="Liberation Serif, Georgia, serif" font-size="12" font-weight="bold" fill="#701c1a" text-anchor="middle">MATURATION CONTRÔLÉE vs ALTÉRATION ET TOXINES</text>
    <line x1="40" y1="34" x2="680" y2="34" stroke="#dfdacf" stroke-width="1"/>
    
    <text x="20" y="55" font-family="Liberation Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#5a6e54">1. Maturation (Noble) :</text>
    <text x="175" y="55" font-family="Liberation Sans, Arial, sans-serif" font-size="9.2" fill="#242124">Enzymes internes (calpaïnes) attendrissant la chair sans microbes.</text>
    <text x="175" y="69" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Froid sec (0 à 2°C) et ventilation. Viande rassise, fromages affinés, saveur umami.</text>

    <text x="20" y="96" font-family="Liberation Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#a3432b">2. Putréfaction :</text>
    <text x="175" y="96" font-family="Liberation Sans, Arial, sans-serif" font-size="9.2" fill="#242124">Bactéries dégradant anarchiquement les protéines en amines toxiques.</text>
    <text x="175" y="110" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Cadavérine, putrescine, odeurs fétides : barrière biologique universelle.</text>

    <text x="20" y="137" font-family="Liberation Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#701c1a">3. Toxines Mortelles :</text>
    <text x="175" y="137" font-family="Liberation Sans, Arial, sans-serif" font-size="9.2" fill="#242124">Clostridium botulinum : neurotoxine létale inodore en milieu sans air.</text>
    <text x="175" y="151" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" fill="#5c5549">Conserves artisanales non acidifiées ou non stérilisées à 121°C sous pression.</text>

    <rect x="20" y="168" width="680" height="18" rx="4" fill="#fbf6f5"/>
    <text x="360" y="181" font-family="Liberation Sans, Arial, sans-serif" font-size="8.8" font-weight="bold" fill="#701c1a" text-anchor="middle">RÈGLE DE SURVIE : Bocal bombé, absence de « pschitt » ou odeur suspecte = ON JETTE IMMÉDIATEMENT.</text>
  </g>
</svg>
