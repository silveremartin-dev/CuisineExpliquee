<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <rect width="800" height="380" rx="14" fill="#fcfbf7" stroke="#dfdacf" stroke-width="2"/>
  
  <text x="400" y="32" font-family="Liberation Serif, Georgia, serif" font-size="20.0" font-weight="bold" fill="#701c1a" text-anchor="middle">THE BIOLOGICAL FORK: AGING vs. PUTREFACTION</text>
  <text x="400" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" fill="#5c5549" text-anchor="middle">How environmental conditions steer protein breakdown toward deep umami or toxic poison.</text>

  <rect x="260" y="68" width="280" height="38" rx="8" fill="#f7f4eb" stroke="#d4a373" stroke-width="1.5"/>
  <text x="400" y="92" font-family="Liberation Serif, Georgia, serif" font-size="15.0" font-weight="bold" fill="#242124" text-anchor="middle">FRESH RAW ORGANIC MATTER</text>

  <path d="M 330 106 L 330 135 L 210 135 L 210 152" fill="none" stroke="#5a6e54" stroke-width="2"/>
  <polygon points="210,158 205,150 215,150" fill="#5a6e54"/>

  <path d="M 470 106 L 470 135 L 590 135 L 590 152" fill="none" stroke="#a3432b" stroke-width="2"/>
  <polygon points="590,158 585,150 595,150" fill="#a3432b"/>

  <!-- Volet Gauche : Maturation Contrôlée -->
  <g transform="translate(40, 162)">
    <rect width="340" height="198" rx="8" fill="#faf7f2" stroke="#5a6e54" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="28" rx="8" fill="#5a6e54"/>
    <text x="170" y="19" font-family="Liberation Serif, Georgia, serif" font-size="14.3" font-weight="bold" fill="#fcfbf7" text-anchor="middle">CONTROLLED AGING (NOBLE ENZYMES)</text>
    
    <text x="14" y="47" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#242124"><tspan font-weight="bold">• Key Agents:</tspan> Endogenous cellular enzymes</text>
    <text x="24" y="61" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#5c5549">(calpains, cathepsins) in resting muscle.</text>

    <text x="14" y="80" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#242124"><tspan font-weight="bold">• Medium:</tspan> Regulated dry cold (32°F to 36°F / 0°C to 2°C),</text>
    <text x="24" y="94" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#5c5549">steady air circulation, salting or acidification.</text>

    <text x="14" y="113" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#242124"><tspan font-weight="bold">• Action:</tspan> Gentle cleavage of actomyosin bonds</text>
    <text x="24" y="127" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#5c5549">cross-links, tenderizing with zero pathogens.</text>

    <text x="14" y="146" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#242124"><tspan font-weight="bold">• Signature:</tspan> Massive release of free glutamate</text>
    <text x="24" y="160" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#5c5549">molecules: explosion of rich umami taste.</text>

    <text x="14" y="182" font-family="Liberation Serif, Georgia, serif" font-size="13.3" font-weight="bold" fill="#5a6e54">→ Outcome: Tender, highly digestible, safe food.</text>
  </g>

  <!-- Volet Droit : Putréfaction Bactérienne -->
  <g transform="translate(420, 162)">
    <rect width="340" height="198" rx="8" fill="#faf7f2" stroke="#a3432b" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="28" rx="8" fill="#701c1a"/>
    <text x="170" y="19" font-family="Liberation Serif, Georgia, serif" font-size="14.3" font-weight="bold" fill="#fcfbf7" text-anchor="middle">BACTERIAL PUTREFACTION (LETHAL HAZARD)</text>
    
    <text x="14" y="47" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#242124"><tspan font-weight="bold">• Key Agents:</tspan> Soil-borne and anaerobic bacteria</text>
    <text x="24" y="61" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#5c5549">(Pseudomonas, Clostridium, enterobacteria).</text>

    <text x="14" y="80" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#242124"><tspan font-weight="bold">• Critical Medium:</tspan> Stagnant moisture and warmth</text>
    <text x="24" y="94" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#5c5549">(50°F to 113°F / 10°C to 45°C), unventilated, zero salt/acid.</text>

    <text x="14" y="113" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#242124"><tspan font-weight="bold">• Action:</tspan> Chaotic enzymatic rot of protein chains</text>
    <text x="24" y="127" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#5c5549">acid chains into toxic biogenic amines.</text>

    <text x="14" y="146" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#242124"><tspan font-weight="bold">• Toxins:</tspan> Cadaverine, putrescine,</text>
    <text x="24" y="160" font-family="Liberation Sans, Arial, sans-serif" font-size="12.6" fill="#5c5549">harmful histamine, and botulinum neurotoxin.</text>

    <text x="14" y="182" font-family="Liberation Serif, Georgia, serif" font-size="13.3" font-weight="bold" fill="#701c1a">→ Outcome: Putrid odor, severe foodborne illness.</text>
  </g>
</svg>
