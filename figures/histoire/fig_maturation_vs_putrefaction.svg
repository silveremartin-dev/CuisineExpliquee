<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <rect width="800" height="360" rx="16" fill="#fcfbf7" stroke="#e8e2d5" stroke-width="2"/>
  
  <!-- Titre -->
  <text x="400" y="32" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#701c1a" text-anchor="middle">LA BIFURCATION BIOLOGIQUE : MATURATION vs PUTRÉFACTION</text>
  <text x="400" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5c5549" text-anchor="middle">Comment l'environnement oriente la dégradation de la matière organique vers l'umami ou le poison.</text>

  <!-- Bloc Central Sommet -->
  <rect x="250" y="70" width="300" height="42" rx="8" fill="#f4eee1" stroke="#d4a373" stroke-width="1.5"/>
  <text x="400" y="96" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#242124" text-anchor="middle">MATIÈRE ORGANIQUE FRAÎCHE</text>

  <!-- Lignes de flux -->
  <path d="M 320 112 L 320 145 L 200 145 L 200 165" fill="none" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="200,172 195,163 205,163" fill="#2d6a4f"/>

  <path d="M 480 112 L 480 145 L 600 145 L 600 165" fill="none" stroke="#9e2a2b" stroke-width="2"/>
  <polygon points="600,172 595,163 605,163" fill="#9e2a2b"/>

  <!-- Volet Gauche : Maturation Contrôlée -->
  <g transform="translate(40, 175)">
    <rect width="330" height="160" rx="10" fill="#ffffff" stroke="#74c69d" stroke-width="1.5"/>
    <rect x="0" y="0" width="330" height="30" rx="10" fill="#2d6a4f"/>
    <text x="165" y="20" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">✓ MATURATION CONTRÔLÉE (NOBLE)</text>
    
    <text x="15" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#1b4332"><tspan font-weight="bold">• Acteurs :</tspan> Enzymes endogènes du muscle (calpaïnes, cathepsines)</text>
    <text x="15" y="72" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#1b4332"><tspan font-weight="bold">• Milieu requis :</tspan> Froid sec (0 à 2°C), salé, ventilé ou acide</text>
    <text x="15" y="92" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#1b4332"><tspan font-weight="bold">• Transformation :</tspan> Clivage doux des ponts d'actomyosine</text>
    <text x="15" y="112" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#1b4332"><tspan font-weight="bold">• Signature :</tspan> Glutamate libre décuplé (puissant arôme umami)</text>
    <text x="15" y="135" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#2d6a4f">→ Résultat : Chair fondante, digestible, saine et savoureuse.</text>
  </g>

  <!-- Volet Droit : Putréfaction Bactérienne -->
  <g transform="translate(430, 175)">
    <rect width="330" height="160" rx="10" fill="#ffffff" stroke="#e63946" stroke-width="1.5"/>
    <rect x="0" y="0" width="330" height="30" rx="10" fill="#9e2a2b"/>
    <text x="165" y="20" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">✗ PUTRÉFACTION BACTÉRIENNE (DANGER)</text>
    
    <text x="15" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#540b0e"><tspan font-weight="bold">• Acteurs :</tspan> Bactéries telluriques et pathogènes (Pseudomonas, Clostridium)</text>
    <text x="15" y="72" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#540b0e"><tspan font-weight="bold">• Milieu accélérateur :</tspan> Humidité tiède (10 à 50°C), absence de sel</text>
    <text x="15" y="92" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#540b0e"><tspan font-weight="bold">• Décomposition :</tspan> Décarboxylation anarchique des acides aminés</text>
    <text x="15" y="112" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#540b0e"><tspan font-weight="bold">• Toxines produites :</tspan> Cadavérine, putrescine, histamine, toxine botulique</text>
    <text x="15" y="135" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9e2a2b">→ Résultat : Odeur fétide, décomposition gluante, intoxication aiguë.</text>
  </g>
</svg>
