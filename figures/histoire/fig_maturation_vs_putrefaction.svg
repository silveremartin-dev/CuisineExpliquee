<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <rect width="800" height="380" rx="14" fill="#fcfbf7" stroke="#dfdacf" stroke-width="2"/>
  
  <text x="400" y="32" font-family="Liberation Serif, Georgia, serif" font-size="16" font-weight="bold" fill="#701c1a" text-anchor="middle">LA BIFURCATION BIOLOGIQUE : MATURATION vs PUTRÉFACTION</text>
  <text x="400" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5c5549" text-anchor="middle">Comment l'environnement oriente la dégradation de la matière vers l'umami ou le poison.</text>

  <rect x="260" y="68" width="280" height="38" rx="8" fill="#f7f4eb" stroke="#d4a373" stroke-width="1.5"/>
  <text x="400" y="92" font-family="Liberation Serif, Georgia, serif" font-size="11.5" font-weight="bold" fill="#242124" text-anchor="middle">MATIÈRE ORGANIQUE FRAÎCHE</text>

  <path d="M 330 106 L 330 135 L 210 135 L 210 152" fill="none" stroke="#5a6e54" stroke-width="2"/>
  <polygon points="210,158 205,150 215,150" fill="#5a6e54"/>

  <path d="M 470 106 L 470 135 L 590 135 L 590 152" fill="none" stroke="#a3432b" stroke-width="2"/>
  <polygon points="590,158 585,150 595,150" fill="#a3432b"/>

  <!-- Volet Gauche : Maturation Contrôlée -->
  <g transform="translate(40, 162)">
    <rect width="340" height="198" rx="8" fill="#faf7f2" stroke="#5a6e54" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="28" rx="8" fill="#5a6e54"/>
    <text x="170" y="19" font-family="Liberation Serif, Georgia, serif" font-size="11" font-weight="bold" fill="#fcfbf7" text-anchor="middle">MATURATION CONTRÔLÉE (NOBLE)</text>
    
    <text x="14" y="47" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124"><tspan font-weight="bold">• Acteurs :</tspan> Enzymes cellulaires endogènes</text>
    <text x="24" y="61" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">(calpaïnes, cathepsines) du muscle au repos.</text>

    <text x="14" y="80" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124"><tspan font-weight="bold">• Milieu :</tspan> Froid sec régulé (0 à 2°C),</text>
    <text x="24" y="94" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">ventilation constante, salage ou acidification.</text>

    <text x="14" y="113" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124"><tspan font-weight="bold">• Action :</tspan> Rupture douce des ponts</text>
    <text x="24" y="127" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">d'actomyosine, attendrissement sans bactéries.</text>

    <text x="14" y="146" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124"><tspan font-weight="bold">• Signature :</tspan> Libération massive de glutamate</text>
    <text x="24" y="160" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">libre : explosion de la saveur umami.</text>

    <text x="14" y="182" font-family="Liberation Serif, Georgia, serif" font-size="9.5" font-weight="bold" fill="#5a6e54">→ Bilan : Chair fondante, digeste et saine.</text>
  </g>

  <!-- Volet Droit : Putréfaction Bactérienne -->
  <g transform="translate(420, 162)">
    <rect width="340" height="198" rx="8" fill="#faf7f2" stroke="#a3432b" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="28" rx="8" fill="#701c1a"/>
    <text x="170" y="19" font-family="Liberation Serif, Georgia, serif" font-size="11" font-weight="bold" fill="#fcfbf7" text-anchor="middle">PUTRÉFACTION BACTÉRIENNE (DANGER)</text>
    
    <text x="14" y="47" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124"><tspan font-weight="bold">• Acteurs :</tspan> Bactéries telluriques et anaérobies</text>
    <text x="24" y="61" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">(Pseudomonas, Clostridium, coliformes).</text>

    <text x="14" y="80" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124"><tspan font-weight="bold">• Milieu critique :</tspan> Humidité stagnante, tiédeur</text>
    <text x="24" y="94" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">(10 à 45°C), atmosphère close sans sel ni acide.</text>

    <text x="14" y="113" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124"><tspan font-weight="bold">• Action :</tspan> Dégradation anarchique des chaînes</text>
    <text x="24" y="127" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">d'acides aminés en amines biogènes toxiques.</text>

    <text x="14" y="146" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124"><tspan font-weight="bold">• Toxines :</tspan> Cadavérine, putrescine,</text>
    <text x="24" y="160" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">histamine nocive et neurotoxine botulique.</text>

    <text x="14" y="182" font-family="Liberation Serif, Georgia, serif" font-size="9.5" font-weight="bold" fill="#701c1a">→ Bilan : Odeur fétide, toxi-infection sévère.</text>
  </g>
</svg>
