  <text x="400" y="54" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5c5549" text-anchor="middle">La cuisson comme prdigestion externe : l'hypothse de Richard Wrangham.</text>

  <!-- Carte Gauche : Le Cru / Primitif -->
  <g transform="translate(40, 75)">
