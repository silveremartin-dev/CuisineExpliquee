<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" rx="14" fill="#fcfbf7" stroke="#dfdacf" stroke-width="2"/>
  
  <text x="400" y="34" font-family="Liberation Serif, Georgia, serif" font-size="17" font-weight="bold" fill="#701c1a" text-anchor="middle">L'ÉTINCELLE ANTHROPOLOGIQUE DU FEU ET LA MATIÈRE</text>
  <text x="400" y="54" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5c5549" text-anchor="middle">La cuisson comme prédigestion externe : l'hypothèse de Richard Wrangham.</text>

  <!-- Carte Gauche : Le Cru / Primitif -->
  <g transform="translate(40, 75)">
    <rect width="340" height="235" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="340" height="28" rx="8" fill="#5c5549"/>
    <text x="170" y="19" font-family="Liberation Serif, Georgia, serif" font-size="11" font-weight="bold" fill="#fcfbf7" text-anchor="middle">ALIMENTATION BRUTE &amp; CRUE</text>
    
    <text x="14" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#242124">1. Coût mécanique démesuré :</text>
    <text x="24" y="63" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">5 à 6 heures de mastication quotidienne,</text>
    <text x="24" y="77" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">usure dentaire accélérée des molaires.</text>

    <text x="14" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#242124">2. Rendement calorique médiocre :</text>
    <text x="24" y="113" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">Fibres de collagène intactes, granules</text>
    <text x="24" y="127" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">d'amidon cristallisés indigestes à cru.</text>

    <text x="14" y="148" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#701c1a">3. Fardeau métabolique :</text>
    <text x="24" y="163" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">Appareil digestif surdimensionné,</text>
    <text x="24" y="177" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">dépense énergétique interne massive.</text>

    <text x="14" y="198" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#701c1a">4. Risque pathogène constant :</text>
    <text x="24" y="213" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">Bactéries telluriques, vers parasites,</text>
    <text x="24" y="227" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">toxines de défense végétales actives.</text>
  </g>

  <!-- Carte Droite : Le Cuit / Révolution -->
  <g transform="translate(420, 75)">
    <rect width="340" height="235" rx="8" fill="#faf7f2" stroke="#d4a373" stroke-width="1.2"/>
    <rect x="0" y="0" width="340" height="28" rx="8" fill="#701c1a"/>
    <text x="170" y="19" font-family="Liberation Serif, Georgia, serif" font-size="11" font-weight="bold" fill="#fcfbf7" text-anchor="middle">MAÎTRISE DU FEU CULINAIRE</text>
    
    <text x="14" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#242124">1. Gélatinisation &amp; Hydrolyse :</text>
    <text x="24" y="63" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">L'amidon devient assimilable à 65°C,</text>
    <text x="24" y="77" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">le collagène fond en gélatine onctueuse.</text>

    <text x="14" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5a6e54">2. Saut calorique net (+300 %) :</text>
    <text x="24" y="113" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">Surcroît d'énergie disponible sans effort,</text>
    <text x="24" y="127" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">digestion réduite à 45 minutes.</text>

    <text x="14" y="148" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#242124">3. Réduction du tube digestif :</text>
    <text x="24" y="163" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">Réallocation métabolique majeure :</text>
    <text x="24" y="177" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#701c1a">croissance fulgurante du néocortex.</text>

    <text x="14" y="198" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5a6e54">4. Sécurité microbiologique :</text>
    <text x="24" y="213" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">Stérilisation thermique dès 65–70°C,</text>
    <text x="24" y="227" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">inactivation des antinutriments.</text>
  </g>

  <!-- Bandeau Inférieur : Les Conséquences Évolutives -->
  <g transform="translate(40, 325)">
    <rect width="720" height="135" rx="10" fill="#faf7f2" stroke="#d4a373" stroke-width="1.5"/>
    <text x="360" y="24" font-family="Liberation Serif, Georgia, serif" font-size="12.5" font-weight="bold" fill="#701c1a" text-anchor="middle">L'ÉQUATION ÉVOLUTIVE : CULINAIRE = CÉRÉBRAL</text>
    <line x1="40" y1="34" x2="680" y2="34" stroke="#dfdacf" stroke-width="1"/>
    
    <g transform="translate(20, 50)">
      <text x="0" y="0" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#5a6e54">Gain énergétique</text>
      <text x="0" y="16" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">+300 % de calories nettes</text>
      <text x="0" y="30" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">par rupture thermique</text>
      <text x="0" y="44" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">des parois cellulaires.</text>
    </g>

    <line x1="185" y1="45" x2="185" y2="115" stroke="#dfdacf" stroke-width="1"/>

    <g transform="translate(205, 50)">
      <text x="0" y="0" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#701c1a">Réduction Intestinale</text>
      <text x="0" y="16" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">Le volume du tractus</text>
      <text x="0" y="30" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">diminue de 40 %, libérant</text>
      <text x="0" y="44" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">des ressources vitales.</text>
    </g>

    <line x1="375" y1="45" x2="375" y2="115" stroke="#dfdacf" stroke-width="1"/>

    <g transform="translate(395, 50)">
      <text x="0" y="0" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#a3432b">Expansion Cérébrale</text>
      <text x="0" y="16" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">Le volume cérébral passe</text>
      <text x="0" y="30" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">de 600 cm³ à 1 400 cm³ :</text>
      <text x="0" y="44" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#701c1a">naissance du néocortex.</text>
    </g>

    <line x1="555" y1="45" x2="555" y2="115" stroke="#dfdacf" stroke-width="1"/>

    <g transform="translate(575, 50)">
      <text x="0" y="0" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#92400e">Socialisation du Foyer</text>
      <text x="0" y="16" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">Attente autour du feu,</text>
      <text x="0" y="30" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">partage différé, récits,</text>
      <text x="0" y="44" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549">fondation du langage.</text>
    </g>
  </g>
</svg>
