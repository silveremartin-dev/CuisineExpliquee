<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <rect width="940" height="500" rx="14" fill="#FCFBF7" stroke="#D1C7B7" stroke-width="1.5"/>
  
  <text x="470" y="38" font-family="Liberation Serif, Georgia, serif" font-size="22" font-weight="bold" fill="#701C1A" text-anchor="middle">GEOPOLITICS AND CHEMISTRY OF THE THREE FOUNDATIONAL FATS</text>
  <text x="470" y="62" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#6B5E55" text-anchor="middle">Smoke points, lipid composition, and thermal behavior in the kitchen</text>

  <!-- Block 1: Butter (North) -->
  <g transform="translate(30, 90)">
    <rect width="270" height="370" rx="10" fill="#FAF6F0" stroke="#C8BAAA" stroke-width="1.5"/>
    <rect width="270" height="42" rx="10" fill="#B45309"/>
    <text x="135" y="26" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. BUTTER (NORTH)</text>
    
    <text x="16" y="72" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#B45309">• Raw smoke point:</text>
    <text x="26" y="93" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#701C1A">130°C to 150°C (266°F - 302°F)</text>
    <text x="26" y="111" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5C5046">Rapid scorching of milk solids</text>
    
    <text x="16" y="145" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#B45309">• Clarified Butter (Ghee):</text>
    <text x="26" y="166" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3D352E">250°C (482°F) post-filtration</text>
    <text x="26" y="184" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5C5046">Pure hydrophobic fat; zero whey</text>
    
    <text x="16" y="218" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#B45309">• Signature Aromas:</text>
    <text x="26" y="239" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#3D352E">Diacetyl and lactones</text>
    <text x="26" y="257" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5C5046">Hazelnut notes at 120°C (248°F)</text>
    
    <rect x="16" y="295" width="238" height="55" rx="6" fill="#F4EADB"/>
    <text x="135" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">Usage: Pastry, sauce glazing,</text>
    <text x="135" y="338" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5C5046" text-anchor="middle">roux, and warm emulsions</text>
  </g>

  <!-- Block 2: Duck Fat (Southwest) -->
  <g transform="translate(335, 90)">
    <rect width="270" height="370" rx="10" fill="#FAF5F0" stroke="#C8BAAA" stroke-width="1.5"/>
    <rect width="270" height="42" rx="10" fill="#A3432B"/>
    <text x="135" y="26" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. POULTRY &amp; DUCK FAT (SOUTHWEST)</text>
    
    <text x="16" y="72" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#A3432B">• Smoke point:</text>
    <text x="26" y="93" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3D352E">190°C to 200°C (374°F - 392°F)</text>
    <text x="26" y="111" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5C5046">Ideal for high-heat searing &amp; roasting</text>
    
    <text x="16" y="145" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#A3432B">• Noble Lipid Profile:</text>
    <text x="26" y="166" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#3D352E">Monounsaturated oleic acid</text>
    <text x="26" y="184" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5C5046">Surprisingly close to olive oil</text>
    
    <text x="16" y="218" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#A3432B">• Crisp Texture:</text>
    <text x="26" y="239" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#3D352E">Crisp golden crust without sogginess</text>
    <text x="26" y="257" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5C5046">Enables long confit cooking</text>
    
    <rect x="16" y="295" width="238" height="55" rx="6" fill="#F4E8DC"/>
    <text x="135" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#A3432B" text-anchor="middle">Usage: Sarladaise potatoes,</text>
    <text x="135" y="338" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#7A3220" text-anchor="middle">confits, roasts, and pan-crisping</text>
  </g>

  <!-- Block 3: Olive Oil (Mediterranean) -->
  <g transform="translate(640, 90)">
    <rect width="270" height="370" rx="10" fill="#FBF7F5" stroke="#C8BAAA" stroke-width="1.5"/>
    <rect width="270" height="42" rx="10" fill="#701C1A"/>
    <text x="135" y="26" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. OLIVE OIL (MEDITERRANEAN)</text>
    
    <text x="16" y="72" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#701C1A">• Smoke point:</text>
    <text x="26" y="93" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3D352E">190°C / 374°F (extra-virgin)</text>
    <text x="26" y="111" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5C5046">210°C / 410°F (refined olive oil)</text>
    
    <text x="16" y="145" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#701C1A">• Protective Polyphenols:</text>
    <text x="26" y="166" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#3D352E">Oleocanthal antioxidants</text>
    <text x="26" y="184" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5C5046">Fruity, grassy, and peppery notes</text>
    
    <text x="16" y="218" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#701C1A">• Thermal behavior:</text>
    <text x="26" y="239" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#3D352E">Solidifies at 4°C (39°F) in fridge</text>
    <text x="26" y="257" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5C5046">Fluid at room temperature</text>
    
    <rect x="16" y="295" width="238" height="55" rx="6" fill="#F0E3DF"/>
    <text x="135" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#701C1A" text-anchor="middle">Usage: Mortar-crushed aïoli,</text>
    <text x="135" y="338" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#501413" text-anchor="middle">dressings, braises, and gentle sautéing</text>
  </g>
</svg>
