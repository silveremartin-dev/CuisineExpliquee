<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <rect width="800" height="420" rx="16" fill="#fcfbf7" stroke="#e8e2d5" stroke-width="2"/>
  
  <text x="400" y="32" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#701c1a" text-anchor="middle">LA GÉOPOLITIQUE DES TROIS CORPS GRAS FONDATEURS</text>
  <text x="400" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5c5549" text-anchor="middle">Avant l'huile raffinée industrielle, la géographie et le climat dictaient les transferts thermiques et le goût.</text>

  <!-- Zone 1 : Le Beurre et la Crème (Nord-Ouest) -->
  <g transform="translate(30, 75)">
    <rect width="235" height="320" rx="10" fill="#ffffff" stroke="#fde047" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="32" rx="10" fill="#eab308"/>
    <text x="117" y="21" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">LE MONDE DU BEURRE</text>

    <text x="12" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#854d0e">Nord-Ouest &amp; Îles Britanniques</text>
    <text x="12" y="68" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#713f12">Normandie, Bretagne, Flandres, Irlande</text>
    
    <rect x="12" y="82" width="211" height="52" rx="5" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
    <text x="18" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#713f12">• Pâturages humides permanents</text>
    <text x="18" y="112" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#713f12">• 82% lipides saturés, 16% eau, 2% caséine</text>
    <text x="18" y="126" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#713f12">• Point de fumée bas : 130 à 150°C</text>

    <text x="12" y="152" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#854d0e">Mécanique Culinaire :</text>
    <text x="12" y="170" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#334155">Cuissons douces, suer sans colorer, arrosage au beurre moussant, montages de sauces au fouet (beurre blanc, hollandaise).</text>

    <text x="12" y="222" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#854d0e">Empreinte Flaveur :</text>
    <text x="12" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#334155">Lactée, ronde, esters de noisette toastée (réaction caséine/lactose à 140°C), nappe délicate.</text>

    <rect x="12" y="275" width="211" height="32" rx="5" fill="#fef9c3"/>
    <text x="117" y="295" font-family="Liberation Sans, Arial, sans-serif" font-size="9" font-weight="bold" fill="#a16207" text-anchor="middle">« La noblesse du velouté »</text>
  </g>

  <!-- Zone 2 : Graisse de Canard / Oie (Sud-Ouest & Centre) -->
  <g transform="translate(282, 75)">
    <rect width="235" height="320" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="32" rx="10" fill="#ea580c"/>
    <text x="117" y="21" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">LA GRAISSE DE VOLAILLE</text>

    <text x="12" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#9a3412">Sud-Ouest &amp; Europe Centrale</text>
    <text x="12" y="68" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#7c2d12">Périgord, Gascogne, Alsace, Bohême</text>
    
    <rect x="12" y="82" width="211" height="52" rx="5" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="18" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#7c2d12">• Élevage d'oies et canards gras</text>
    <text x="18" y="112" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#7c2d12">• 55% acide oléique mono-insaturé</text>
    <text x="18" y="126" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#7c2d12">• Point de fumée élevé : 190°C</text>

    <text x="12" y="152" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#9a3412">Mécanique Culinaire :</text>
    <text x="12" y="170" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#334155">Le confisage ancestral : cuisson lente sous graisse hermétique à 85°C. Rissolage vif de pommes de terre et haricots.</text>

    <text x="12" y="222" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#9a3412">Empreinte Flaveur :</text>
    <text x="12" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#334155">Profonde, carnée, croustillant sonore inimitable, conservation jusqu'à 1 an en bocal de grès.</text>

    <rect x="12" y="275" width="211" height="32" rx="5" fill="#ffedd5"/>
    <text x="117" y="295" font-family="Liberation Sans, Arial, sans-serif" font-size="9" font-weight="bold" fill="#c2410c" text-anchor="middle">« La puissance du confit »</text>
  </g>

  <!-- Zone 3 : Huile d'Olive (Bassin Méditerranéen) -->
  <g transform="translate(535, 75)">
    <rect width="235" height="320" rx="10" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="32" rx="10" fill="#16a34a"/>
    <text x="117" y="21" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">L'HUILE D'OLIVE</text>

    <text x="12" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#14532d">Bassin Méditerranéen</text>
    <text x="12" y="68" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#14532d">Provence, Toscane, Grèce, Andalousie</text>
    
    <rect x="12" y="82" width="211" height="52" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="18" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#14532d">• Sols arides et garrigues ensoleillées</text>
    <text x="18" y="112" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#14532d">• 75% acide oléique, polyphénols antiox.</text>
    <text x="18" y="126" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#14532d">• Point de fumée : 190 à 210°C (extra vierge)</text>

    <text x="12" y="152" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#14532d">Mécanique Culinaire :</text>
    <text x="12" y="170" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#334155">Émulsions froides pilées au mortier (aïoli, pesto), friture légère, filet cru de finition pour préserver les polyphénols.</text>

    <text x="12" y="222" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#14532d">Empreinte Flaveur :</text>
    <text x="12" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#334155">Fruitée, ardente, poivrée, amertume végétale stimulatrice des papilles et de la salivation.</text>

    <rect x="12" y="275" width="211" height="32" rx="5" fill="#dcfce7"/>
    <text x="117" y="295" font-family="Liberation Sans, Arial, sans-serif" font-size="9" font-weight="bold" fill="#15803d" text-anchor="middle">« Le feu solaire végétal »</text>
  </g>
</svg>
