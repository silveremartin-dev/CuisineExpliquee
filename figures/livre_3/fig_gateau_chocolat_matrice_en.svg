<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <rect width="880" height="520" rx="14" fill="#FCFBF7" stroke="#DFDACF" stroke-width="2"/>
  <text x="440" y="34" font-family="Liberation Serif, Georgia, serif" font-size="20" font-weight="bold" fill="#701C1A" text-anchor="middle">THE UNIVERSAL CAKE MATRIX &amp; OVEN THERMODYNAMICS</text>
  <text x="440" y="55" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" fill="#5C5549" text-anchor="middle">Functional pastry equations of state and the physics of oven preheating.</text>

  <!-- Top Banner: Equation of State -->
  <g transform="translate(30, 72)">
    <rect width="820" height="62" rx="8" fill="#F2ECE1" stroke="#B45309" stroke-width="1.5"/>
    <text x="410" y="25" font-family="Liberation Serif, Georgia, serif" font-size="14" font-weight="bold" fill="#701C1A" text-anchor="middle">THE EQUATION OF STATE: THE RECIPE AS A MODULAR SYSTEM</text>
    <text x="410" y="47" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6B4423" text-anchor="middle">Fat Medium (Butter/Oil) + Sweetening Agent + Starch (Flour) + Binder (Egg/Aquafaba) + Heat = CAKE</text>
  </g>

  <!-- Method 1: Direct Emulsion -->
  <g transform="translate(30, 148)">
    <rect width="395" height="175" rx="8" fill="#FAF7F2" stroke="#966C3B" stroke-width="1.5"/>
    <rect width="395" height="30" rx="8" fill="#6B4423"/>
    <text x="197" y="20" font-family="Liberation Serif, Georgia, serif" font-size="13.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">METHOD 1: DIRECT EMULSION (QUICK)</text>
    <text x="16" y="50" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Direct blend: whole eggs + sugar + melted chocolate</text>
    <text x="26" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">and melted butter + sifted flour folded in gently.</text>
    <text x="16" y="88" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Active time: 4 minutes. A single prep bowl to wash.</text>
    <text x="16" y="110" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#5A6E54" font-weight="bold">✓ Resulting texture: Dense, moist, and melting crumb,</text>
    <text x="26" y="126" font-family="Liberation Sans, Arial, sans-serif" font-size="12.0" fill="#5C5549">ideal for molten lava cake, brownies, and dense financiers.</text>
    <text x="16" y="150" font-family="Liberation Sans, Arial, sans-serif" font-size="12.0" font-weight="bold" fill="#701C1A">Rule: Never over-whisk once flour is added (limits gluten elasticity).</text>
  </g>

  <!-- Method 2: Whipped Whites -->
  <g transform="translate(455, 148)">
    <rect width="395" height="175" rx="8" fill="#FAF7F2" stroke="#B45309" stroke-width="1.5"/>
    <rect width="395" height="30" rx="8" fill="#B45309"/>
    <text x="197" y="20" font-family="Liberation Serif, Georgia, serif" font-size="13.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">METHOD 2: WHIPPED EGG WHITES</text>
    <text x="16" y="50" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Gentle folding of stiff albumin foam with a silicone</text>
    <text x="26" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">spatula into the rich chocolate-butter base.</text>
    <text x="16" y="88" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#242124">• Thermal expansion of trapped air bubbles in oven.</text>
    <text x="16" y="110" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#6B4423" font-weight="bold">✓ Resulting texture: Soft, airy, and light crumb</text>
    <text x="26" y="126" font-family="Liberation Sans, Arial, sans-serif" font-size="12.0" fill="#5C5549">with open cell structure (sponge cake, génoise, soufflé).</text>
    <text x="16" y="150" font-family="Liberation Sans, Arial, sans-serif" font-size="12.0" font-weight="bold" fill="#B45309">Plant alternative: Chickpea aquafaba foam.</text>
  </g>

  <!-- Bottom Banner: Why Bake in Preheated Oven -->
  <g transform="translate(30, 340)">
    <rect width="820" height="156" rx="8" fill="#FAF7F2" stroke="#701C1A" stroke-width="1.5"/>
    <rect width="820" height="30" rx="8" fill="#701C1A"/>
    <text x="410" y="20" font-family="Liberation Serif, Georgia, serif" font-size="13.5" font-weight="bold" fill="#FCFBF7" text-anchor="middle">WHY BAKE IN A PREHEATED OVEN (180°C / 356°F) RATHER THAN COLD?</text>

    <text x="18" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" fill="#242124"><tspan font-weight="bold" fill="#5A6E54">1. Oven Spring (Synchronized Gas Expansion):</tspan> In a hot 350°F (180°C) oven, water vapor</text>
    <text x="34" y="69" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#5C5549">and CO₂ expand explosively, lifting batter before the outer crust sets.</text>

    <text x="18" y="93" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" fill="#242124"><tspan font-weight="bold" fill="#5A6E54">2. Structural Setting:</tspan> Egg proteins coagulate (154°F to 183°F / 68°C to 84°C) and starch gelatinizes</text>
    <text x="34" y="110" font-family="Liberation Sans, Arial, sans-serif" font-size="12.2" fill="#5C5549">at the peak of bubble expansion, locking the airy crumb structure in place.</text>

    <text x="18" y="136" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" fill="#701C1A"><tspan font-weight="bold">✗ Cold Oven Start:</tspan> Butter melts at 90°F (32°C), emulsion collapses, gas leaks out before setting → flat, gummy cake.</text>
  </g>
</svg>
