<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400" y="38" font-family="Liberation Sans, Arial, sans-serif" font-size="22.8" font-weight="bold" fill="#0f172a" text-anchor="middle">LA MATRICE UNIVERSELLE DU GÂTEAU ET LA RIGUEUR DU FOUR</text>
  <text x="400" y="62" font-family="Liberation Sans, Arial, sans-serif" font-size="16.9" fill="#64748b" text-anchor="middle">L'équation fonctionnelle : Gras + Sucre + Féculent + Protéine liante + Énergie.</text>
  <g transform="translate(40, 85)">
    <rect width="720" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="360" y="26" font-family="Liberation Sans, Arial, sans-serif" font-size="15.6" font-weight="bold" fill="#92400e" text-anchor="middle">L'ÉQUATION D'ÉTAT : SUBSTANCE = COMBINAISON MODULAIRE</text>
    <text x="360" y="47" font-family="Liberation Sans, Arial, sans-serif" font-size="15.0" fill="#78350f" text-anchor="middle">Gras (90g) + Sucre (100g) + Féculent (75g) + Liant Protéique (3 œufs) + Goût (200g choco) + Chaleur = GÂTEAU</text>
  </g>
  <g transform="translate(40, 160)">
    <rect width="345" height="155" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="28" rx="10" fill="#64748b"/>
    <text x="172" y="19" font-family="Liberation Sans, Arial, sans-serif" font-size="15.0" font-weight="bold" fill="#ffffff" text-anchor="middle">MÉTHODE 1 : TOUT-EN-UN (RAPIDE)</text>
    <text x="15" y="46" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#334155">• Mélange brut : Sucre + Œufs entiers + Farine + Beurre/Choco fondus.</text>
    <text x="15" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#334155">• Temps de préparation : 3 minutes. Zéro vaisselle superflue.</text>
    <text x="15" y="86" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#334155">• <tspan font-weight="bold">Résultat cuit :</tspan> Moelleux dense, fondant au cœur, peu aéré.</text>
    <text x="15" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#15803d">Parfait pour brownies, fondants denses et gâteaux de voyage.</text>
    <text x="15" y="126" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#dc2626">Attention : ne pas trop mélanger après la farine pour éviter le gluten dur.</text>
  </g>
  <g transform="translate(415, 160)">
    <rect width="345" height="155" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="28" rx="10" fill="#d97706"/>
    <text x="172" y="19" font-family="Liberation Sans, Arial, sans-serif" font-size="15.0" font-weight="bold" fill="#ffffff" text-anchor="middle">MÉTHODE 2 : SÉPARATION DES BLANCS EN NEIGE</text>
    <text x="15" y="46" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#334155">• Jaunes blanchis + sucre, puis choco/beurre/farine, puis blancs montés.</text>
    <text x="15" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#334155">• <tspan font-weight="bold">La réalité sensorielle :</tspan> En théorie plus alvéolé ; en pratique, le poids</text>
    <text x="25" y="80" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#334155">du chocolat dense et du beurre effondre une partie des bulles !</text>
    <text x="15" y="102" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#1e40af"><tspan font-weight="bold">Verdict expérimental :</tspan> Différence minime en bouche pour 2x plus</text>
    <text x="25" y="117" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#1e40af">de temps et de vaisselle. Justifié seulement pour biscuits soufflés légers.</text>
  </g>
  <g transform="translate(40, 330)">
    <rect width="720" height="100" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="360" y="24" font-family="Liberation Sans, Arial, sans-serif" font-size="16.2" font-weight="bold" fill="#1e40af" text-anchor="middle">POURQUOI DÉMARRER DANS UN FOUR CHAUD (180°C) PLUTÔT QUE FROID ?</text>
    <text x="20" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#1e3a8a"><tspan font-weight="bold">1. La poussée gazeuse synchronisée :</tspan> Le CO₂ de la levure et la vapeur d'eau se dilatent violemment à chaud. Dans un four chaud, les bulles gonflent AVANT que la pâte ne fige.</text>
    <text x="20" y="68" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#1e3a8a"><tspan font-weight="bold">2. La fixation des cloisons :</tspan> À 180°C, les protéines de l'œuf coagulent et l'amidon gélatinise en périphérie, rigidifiant les alvéoles au pic de dilatation.</text>
    <text x="20" y="88" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" fill="#b91c1c"><tspan font-weight="bold">Dans un four froid :</tspan> Le beurre fond trop tôt, la pâte s'étale liquide, le gaz s'échappe lentement sans pousser : gâteau lourd et tassé.</text>
  </g>
</svg>