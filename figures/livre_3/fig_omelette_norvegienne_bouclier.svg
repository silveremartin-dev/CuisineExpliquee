<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" height="100%">
  <rect width="760" height="320" rx="14" fill="#fcfbf7" stroke="#e8e2d5" stroke-width="2"/>
  
  <text x="380" y="30" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#701c1a" text-anchor="middle">LE BOUCLIER THERMIQUE DE LA MERINGUE : L'OMELETTE NORVÉGIENNE</text>
  <text x="380" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#5c5549" text-anchor="middle">Comment cuire à 240°C un dôme sans faire fondre la glace à -18°C située au cœur.</text>

  <!-- Flammes et chaleur four du haut -->
  <g transform="translate(180, 65)">
    <path d="M 50 15 L 50 0" stroke="#dc2626" stroke-width="2"/>
    <polygon points="50,22 46,14 54,14" fill="#dc2626"/>
    <text x="50" y="-4" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#dc2626" text-anchor="middle">240°C</text>

    <path d="M 200 15 L 200 0" stroke="#ea580c" stroke-width="2"/>
    <polygon points="200,22 196,14 204,14" fill="#ea580c"/>
    <text x="200" y="-4" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#ea580c" text-anchor="middle">FLAMBAGE 800°C</text>

    <path d="M 350 15 L 350 0" stroke="#dc2626" stroke-width="2"/>
    <polygon points="350,22 346,14 354,14" fill="#dc2626"/>
    <text x="350" y="-4" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#dc2626" text-anchor="middle">240°C</text>
  </g>

  <!-- Meringue dorée externe (Dôme) -->
  <path d="M 160 260 C 160 110 600 110 600 260 Z" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
  <!-- Flammes dorées en surface -->
  <path d="M 230 165 Q 240 145 250 165" stroke="#b45309" stroke-width="2" fill="none"/>
  <path d="M 360 130 Q 370 110 380 130" stroke="#b45309" stroke-width="2" fill="none"/>
  <path d="M 490 160 Q 500 140 510 160" stroke="#b45309" stroke-width="2" fill="none"/>

  <!-- Texte Meringue -->
  <text x="380" y="150" font-family="Liberation Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#78350f" text-anchor="middle">MOUCHE DE MERINGUE : 90% D'AIR IMMOBILE</text>
  <text x="380" y="166" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#92400e" text-anchor="middle">Conductivité thermique infime : λ = 0,026 W/(m·K) (Bouclier thermique parfait)</text>

  <!-- Bloc de Glace au centre -->
  <path d="M 270 260 C 270 190 490 190 490 260 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="380" y="222" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">CRÈME GLACÉE FERME (-18°C)</text>
  <text x="380" y="238" font-family="Liberation Sans, Arial, sans-serif" font-size="8.5" fill="#0369a1" text-anchor="middle">Aucune calorie n'atteint le cœur : zéro fusion !</text>

  <!-- Socle Génoise -->
  <rect x="140" y="260" width="480" height="22" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="275" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#854d0e" text-anchor="middle">Socle de Génoise biscuitée : isolant inférieur contre la conduction du plat</text>
</svg>
