<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <rect width="800" height="420" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400" y="38" font-family="Liberation Sans, Arial, sans-serif" font-size="22.8" font-weight="bold" fill="#0f172a" text-anchor="middle">LA PURÉE PARFAITE SELON HESTON BLUMENTHAL</text>
  <text x="400" y="62" font-family="Liberation Sans, Arial, sans-serif" font-size="16.9" fill="#64748b" text-anchor="middle">L'infusion aromatique des épluchures dans le lait et le respect mécanique des cellules d'amidon.</text>
  <g transform="translate(40, 85)">
    <rect width="345" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="30" rx="12" fill="#d97706"/>
    <text x="172" y="20" font-family="Liberation Sans, Arial, sans-serif" font-size="15.6" font-weight="bold" fill="#ffffff" text-anchor="middle">LE SECRET MOLÉCULAIRE : LA PEAU</text>
    <ellipse cx="172" cy="105" rx="80" ry="50" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <ellipse cx="172" cy="105" rx="72" ry="42" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="172" y="105" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" fill="#92400e" text-anchor="middle">Chair centrale :</text>
    <text x="172" y="119" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#b45309" text-anchor="middle">Amidon pur (neutre)</text>
    <text x="172" y="180" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" font-weight="bold" fill="#78350f" text-anchor="middle">Sous-épiderme (0-2 mm) :</text>
    <text x="172" y="196" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#78350f" text-anchor="middle">85% des molécules d'arômes volatils</text>
    <text x="172" y="210" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#475569" font-style="italic">(Méthional, alkylpyrazines à goût de pomme de terre)</text>
    <rect x="20" y="230" width="305" height="55" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
    <text x="172" y="248" font-family="Liberation Sans, Arial, sans-serif" font-size="13.7" font-weight="bold" fill="#92400e" text-anchor="middle">Le Geste Blumenthal :</text>
    <text x="172" y="264" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#78350f" text-anchor="middle">Laver impeccablement les pelures et les faire infuser 30 min</text>
    <text x="172" y="278" font-family="Liberation Sans, Arial, sans-serif" font-size="13.3" fill="#78350f" text-anchor="middle">dans le lait chaud avant de filtrer et monter la purée !</text>
  </g>
  <g transform="translate(415, 85)">
    <rect width="345" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="30" rx="12" fill="#16a34a"/>
    <text x="172" y="20" font-family="Liberation Sans, Arial, sans-serif" font-size="15.6" font-weight="bold" fill="#ffffff" text-anchor="middle">MÉCANIQUE CELLULAIRE : PRESSE vs MIXEUR</text>
    <rect x="20" y="45" width="305" height="110" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="35" y="65" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" font-weight="bold" fill="#166534">✓ PRESSE-PURÉE / MOULIN À LÉGUMES</text>
    <text x="35" y="85" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#14532d">• Pression mécanique douce.</text>
    <text x="35" y="100" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#14532d">• Les cellules végétales se séparent sans éclater.</text>
    <text x="35" y="115" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#14532d">• L'amylose reste piégé à l'intérieur des cellules.</text>
    <text x="35" y="135" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" font-weight="bold" fill="#15803d">Résultat : Texture légère, soyeuse et fondante.</text>
    <rect x="20" y="170" width="305" height="110" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="35" y="190" font-family="Liberation Sans, Arial, sans-serif" font-size="14.3" font-weight="bold" fill="#991b1b">✗ MIXEUR PLONGEANT / ROBOT À LAME</text>
    <text x="35" y="210" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#7f1d1d">• Rotation à 10 000 tours/min cisaillant les parois.</text>
    <text x="35" y="225" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#7f1d1d">• Éventration massive des cellules de pomme de terre.</text>
    <text x="35" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" fill="#7f1d1d">• L'amylose libre se polymérise en colle d'amidon.</text>
    <text x="35" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" font-weight="bold" fill="#b91c1c">Résultat : Purée gluante, élastique comme du mastic.</text>
  </g>
</svg>