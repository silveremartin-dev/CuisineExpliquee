<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="100%" height="100%">
  <rect width="800" height="410" rx="12" fill="#fcfbf7" stroke="#dfdacf" stroke-width="1.5"/>
  <text x="400" y="36" font-family="Liberation Serif, Georgia, serif" font-size="18" font-weight="bold" fill="#701c1a" text-anchor="middle">LA PURÉE PARFAITE SELON HESTON BLUMENTHAL</text>
  <text x="400" y="58" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#5c5549" text-anchor="middle">L'infusion aromatique des épluchures dans le lait et le respect mécanique des cellules d'amidon.</text>

  <!-- Volet Gauche : La Peau -->
  <g transform="translate(40, 82)">
    <rect width="345" height="300" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="345" height="30" rx="8" fill="#8c7355"/>
    <text x="172.5" y="20" font-family="Liberation Serif, Georgia, serif" font-size="11.5" font-weight="bold" fill="#fcfbf7" text-anchor="middle">LE SECRET MOLÉCULAIRE : LA PEAU</text>

    <ellipse cx="172.5" cy="102" rx="82" ry="48" fill="#f2ece1" stroke="#92400e" stroke-width="3"/>
    <ellipse cx="172.5" cy="102" rx="73" ry="40" fill="#fcfbf7" stroke="#d4a373" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="172.5" y="100" font-family="Liberation Serif, Georgia, serif" font-size="11" font-weight="bold" fill="#242124" text-anchor="middle">Chair centrale :</text>
    <text x="172.5" y="116" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#5c5549" text-anchor="middle">Amidon pur (neutre en goût)</text>

    <text x="172.5" y="176" font-family="Liberation Serif, Georgia, serif" font-size="10.5" font-weight="bold" fill="#701c1a" text-anchor="middle">Sous-épiderme (0 à 2 mm sous la peau) :</text>
    <text x="172.5" y="193" font-family="Liberation Sans, Arial, sans-serif" font-size="9.8" fill="#242124" text-anchor="middle">Concentre 85 % des arômes volatils nobles</text>
    <text x="172.5" y="208" font-family="Liberation Sans, Arial, sans-serif" font-size="9" fill="#5c5549" font-style="italic" text-anchor="middle">(Méthional, pyrazines terreuses et grillées)</text>

    <rect x="20" y="226" width="305" height="58" rx="6" fill="#faf6ee" stroke="#d4a373" stroke-width="1"/>
    <text x="172.5" y="244" font-family="Liberation Serif, Georgia, serif" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">Le Geste Blumenthal :</text>
    <text x="172.5" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124" text-anchor="middle">Brosser les pelures et les infuser 25 min dans le lait</text>
    <text x="172.5" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="9.5" fill="#242124" text-anchor="middle">chaud avant de filtrer au chinois sur la purée !</text>
  </g>

  <!-- Volet Droit : Presse vs Mixeur -->
  <g transform="translate(415, 82)">
    <rect width="345" height="300" rx="8" fill="#faf7f2" stroke="#dfdacf" stroke-width="1.2"/>
    <rect x="0" y="0" width="345" height="30" rx="8" fill="#701c1a"/>
    <text x="172.5" y="20" font-family="Liberation Serif, Georgia, serif" font-size="11.5" font-weight="bold" fill="#fcfbf7" text-anchor="middle">MÉCANIQUE CELLULAIRE : PRESSE vs MIXEUR</text>

    <rect x="20" y="45" width="305" height="112" rx="6" fill="#f4f6f4" stroke="#6e826b" stroke-width="1.2"/>
    <text x="172.5" y="66" font-family="Liberation Serif, Georgia, serif" font-size="11" font-weight="bold" fill="#5a6e54" text-anchor="middle">✓ Presse-Purée ou Mouli-Légumes (Vertueux)</text>
    <text x="172.5" y="86" font-family="Liberation Sans, Arial, sans-serif" font-size="9.6" fill="#242124" text-anchor="middle">• Sépare les cellules sans déchirer leurs parois.</text>
    <text x="172.5" y="104" font-family="Liberation Sans, Arial, sans-serif" font-size="9.6" fill="#242124" text-anchor="middle">• L'amidon gonflé reste enfermé dans ses sacs.</text>
    <text x="172.5" y="122" font-family="Liberation Sans, Arial, sans-serif" font-size="9.6" fill="#5a6e54" font-weight="bold" text-anchor="middle">→ Texture nuageuse, courte et fondante.</text>

    <rect x="20" y="172" width="305" height="112" rx="6" fill="#fbf6f5" stroke="#b06d60" stroke-width="1.2"/>
    <text x="172.5" y="193" font-family="Liberation Serif, Georgia, serif" font-size="11" font-weight="bold" fill="#701c1a" text-anchor="middle">✗ Mixeur Plongeant ou Blender (À Bannir)</text>
    <text x="172.5" y="213" font-family="Liberation Sans, Arial, sans-serif" font-size="9.6" fill="#242124" text-anchor="middle">• Les lames à 10 000 tr/min éventrent les cellules.</text>
    <text x="172.5" y="231" font-family="Liberation Sans, Arial, sans-serif" font-size="9.6" fill="#242124" text-anchor="middle">• L'amidon libre se répand dans l'eau et le lait.</text>
    <text x="172.5" y="249" font-family="Liberation Sans, Arial, sans-serif" font-size="9.6" fill="#701c1a" font-weight="bold" text-anchor="middle">→ Colle à tapisser élastique et gluante !</text>
  </g>
</svg>
